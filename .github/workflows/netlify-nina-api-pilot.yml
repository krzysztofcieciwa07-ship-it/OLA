name: Netlify NINA API Pilot Guard

on:
  push:
    branches:
      - pilot/netlify-nina-api-20261110
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-nina-api-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-guard:
    name: Static safety and branch guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --version
          node --check scripts/netlify-pilot-check.mjs
          node --check netlify-pilot/pilot.js

      - name: Test allowed branch and fail-closed cases
        run: node --test tests/netlify-nina-pilot.test.mjs
