name: Human Gate Policy Unit Tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read
  administration: read

jobs:
  policy-tests:
    name: human-gate-policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run deterministic Human Gate policy tests
        run: node --test tests/test_human_gate_policy.cjs
      - name: Verify GITHUB_TOKEN collaborator permission read
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const probes = [
              { username: "krzysztofcieciwa07-ship-it", expected: "admin" },
              { username: "krzys167-crypto", expected: "read" },
            ];
            for (const probe of probes) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: probe.username,
              });
              core.notice("Collaborator permission verified: " + probe.username + "=" + data.permission);
              if (data.permission !== probe.expected) {
                core.setFailed("Unexpected repository permission for " + probe.username + ": expected " + probe.expected);
              }
            }
