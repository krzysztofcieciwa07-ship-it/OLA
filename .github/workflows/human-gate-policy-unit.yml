name: Human Gate Policy Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy-tests:
    name: human-gate-policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run deterministic Human Gate policy tests
        run: node --test tests/test_human_gate_policy.cjs
