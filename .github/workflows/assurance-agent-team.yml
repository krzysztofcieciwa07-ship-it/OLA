name: OLA Assurance Agent Team

on:
  pull_request:
    branches: [main]
    paths:
      - "app/assurance_team/**"
      - "tests/test_assurance_team.py"
      - ".github/workflows/assurance-agent-team.yml"
      - "docs/assurance-team.md"
  push:
    branches: [main]
    paths:
      - "app/assurance_team/**"
      - "tests/test_assurance_team.py"
      - ".github/workflows/assurance-agent-team.yml"
      - "docs/assurance-team.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ola-assurance-team-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify assurance-team contract
        run: python -m pytest -q tests/test_assurance_team.py

      - name: Run sequential specialist team
        id: team
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python -m app.assurance_team.cli \
            --repo-root . \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir artifacts \
            --timeout-seconds 900
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact-SHA evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-assurance-team-${{ github.sha }}
          path: |
            artifacts/team-report.json
            artifacts/team-events.jsonl
            artifacts/team-evidence.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce enabled specialist results
        if: always()
        env:
          TEAM_EXIT_CODE: ${{ steps.team.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$TEAM_EXIT_CODE" = "0"
