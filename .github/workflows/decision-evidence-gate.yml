name: OLA Decision Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  decision-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Decision policy tests
        run: python -m pytest -q tests/test_decision_report.py tests/test_decision_report_verifier.py tests/test_nina_igor_chain.py
      - name: Static verifier smoke test
        run: |
          python - <<'PY'
          import json, hashlib, subprocess, tempfile
          from app.hashchain import canonical_json
          body={"schema":"ola.decision-report.v1","policy":{"status":"REVIEW"}}
          body["report_sha256"]=hashlib.sha256(canonical_json({k:v for k,v in body.items() if k!="report_sha256"}).encode()).hexdigest()
          with tempfile.NamedTemporaryFile("w+",suffix=".json") as f:
              json.dump(body,f); f.flush()
              p=subprocess.run(["python","scripts/verify_decision_report.py",f.name],capture_output=True,text=True)
              assert p.returncode==0 and "DECISION_REPORT=VERIFIED" in p.stdout
          print("DECISION_EVIDENCE_GATE=VERIFIED")
          PY
