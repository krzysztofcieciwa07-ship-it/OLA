name: OLA Python Static Gate

on:
  push:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q app tests scripts evidence_graph.py
      - name: Reject undefined identifiers in API boundary
        run: |
          python -m pip install --disable-pip-version-check flake8==7.3.0
          flake8 app/main.py --count --select=E9,F63,F7,F82 --show-source --statistics
