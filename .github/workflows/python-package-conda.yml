name: OLA Python Package Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8==7.4.1
      - name: Check Python syntax
        run: python -m compileall -q app scripts tests evidence_graph.py
      - name: Check syntax and undefined names
        run: python -m flake8 app scripts tests evidence_graph.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run full test suite
        env:
          OLA_LLM_PROVIDER: none
          OLA_LLM_MODE: deterministic
        run: python -m pytest -q
      - name: Verify exact source provenance and local test proof
        env:
          OLA_LLM_PROVIDER: none
          OLA_LLM_MODE: deterministic
        run: python scripts/ola_truth_cycle.py --repo . --output-dir "$RUNNER_TEMP/ola_truth_reports" --timeout 180
