name: OLA Python Compatibility Gate

# Replaces a nonfunctional Conda template that referenced missing environment.yml.
# Keep the historical path for traceability; execute real source+contract checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLA_LLM_MODE: deterministic
      # Test fixture only. Do not reuse for deployment.
      OLA_API_KEY_PEPPER: ${{ github.sha }}
    steps:
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned project dependencies and linter
        run: |
          python -m pip install -r requirements.txt flake8==7.3.0
          python -m pip check

      - name: Check syntax and undefined names
        run: |
          python -m compileall -q app scripts tests
          python -m flake8 app scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run full contract suite
        run: python -m pytest -q
