name: Python package CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Lint critical errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest -q

  notify-failure:
    name: Notify CI failure
    if: ${{ always() && needs.build-linux.result == 'failure' }}
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create or update the failure incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ALERT_TITLE: "[CI FAILURE] Python package CI | ${{ github.head_ref || github.ref_name }}"
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json url,name,headSha,headBranch,event,conclusion,jobs)"
          failed_jobs="$(printf '%s' "$run_json" | jq -r '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          body="$(cat <<EOF
          **Automated CI failure alert**

          - Workflow: Python package CI
          - Branch: $BRANCH
          - Source SHA: $SOURCE_SHA
          - Failed job(s): ${failed_jobs:-unknown}
          - Run attempt: $RUN_ATTEMPT
          - Triggered by: @$ACTOR
          - Run: $RUN_URL

          This issue is deduplicated per workflow and branch. A later failure updates this incident with a new run link.
          EOF
          )"

          existing="$(gh issue list --repo "$REPOSITORY" --state open --search "in:title [CI FAILURE] Python package CI" --json number,title --jq '.[] | select(.title == env.ALERT_TITLE) | .number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            issue_number="$existing"
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
            gh issue edit "$issue_number" --repo "$REPOSITORY" --add-assignee "$REPOSITORY_OWNER"
          else
            issue_url="$(gh issue create --repo "$REPOSITORY" --title "$ALERT_TITLE" --body "$body" --assignee "$REPOSITORY_OWNER")"
            issue_number="$(printf '%s' "$issue_url" | awk -F/ '{print $NF}')"
          fi

          confirmed="$(gh issue view "$issue_number" --repo "$REPOSITORY" --json number,title,assignees --jq '.number')"
          test "$confirmed" = "$issue_number"
          echo "CI_FAILURE_ALERT=RECORDED issue=$issue_number run=$RUN_ID source=$SOURCE_SHA"

