name: Python package CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Contract tooling is test-only; the production image installs requirements.txt only.
          python -m pip install -r requirements-contracts.txt
          python -m pip install flake8

      - name: Lint critical errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run application tests
        run: pytest -q tests

      - name: Run offline signed-approval contract tests
        run: PYTHONPATH=. pytest -q contract_tests
