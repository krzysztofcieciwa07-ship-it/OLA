name: NINA IGOR Ollama Full Flow — Stacked Security PRs

on:
  pull_request:
    branches:
      - "security/**"
    types: [opened, synchronize, reopened]

concurrency:
  group: nina-igor-security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-nina-igor-ollama:
    name: Real NINA → IGOR → Provenance → Replay (Ollama)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/nina-igor-ollama.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
