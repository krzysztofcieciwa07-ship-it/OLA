name: OLA Agent Firewall v0.2 contract tests

on:
  push:
    branches: ["feat/agent-firewall-v0.2-20261110"]
  pull_request:
    paths:
      - "app/agent_firewall/**"
      - "app/hashchain.py"
      - "scripts/agent_firewall_signer.py"
      - "scripts/igor_agent_firewall.py"
      - "scripts/ola_systemd_exec.py"
      - "tests/test_agent_firewall_*.py"
      - "tests/test_ola_systemd_exec.py"
      - ".github/workflows/agent-firewall-v02.yml"
      - "policies/agent_firewall_v0_2.toml"

permissions:
  contents: read

jobs:
  firewall-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application, signer and tests
        run: python -m compileall -q app/agent_firewall app/hashchain.py scripts tests
      - name: Firewall policy, target, checkpoint and execution contracts
        run: pytest -q tests/test_agent_firewall_policy.py tests/test_agent_firewall_targets.py tests/test_agent_firewall_checkpoints.py tests/test_agent_firewall_hashchain.py tests/test_agent_firewall_connector.py tests/test_ola_systemd_exec.py
