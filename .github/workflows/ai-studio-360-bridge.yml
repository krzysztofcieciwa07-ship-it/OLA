name: AI Studio 3.6 Archive Bridge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  verify-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install complete OLA test dependencies
        run: python -m pip install -r requirements.txt
      - name: Archive safety regression
        run: python -m pytest tests/test_ai_studio_archive.py -q
      - name: Compile adapter
        run: python -m py_compile scripts/ai_studio_archive.py
