name: OLA Exact PR Head Validation

on:
  pull_request:
    branches:
      - main
      - integration/ola-first-five-closure-20261106

permissions:
  contents: read

jobs:
  exact-head:
    name: Exact HEAD source and full test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      OLA_LLM_MODE: deterministic
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Exact HEAD validation checked $actual, expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi
          {
            echo "### Exact PR HEAD source"
            echo "- Expected: $EXPECTED_SOURCE_SHA"
            echo "- Checked out: $actual"
            echo "- Result: EXACT_SOURCE_SHA_VERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Install test dependency set
        run: python -m pip install --no-cache-dir -r requirements-test.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run complete test suite on exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          OLA_LLM_MODE=deterministic python -m pytest -q

      - name: Record exact-head test evidence
        if: always()
        shell: bash
        run: |
          {
            echo "- Candidate SHA: $EXPECTED_SOURCE_SHA"
            echo "- Checkout SHA: $(git rev-parse HEAD)"
            echo "- Test command: OLA_LLM_MODE=deterministic python -m pytest -q"
          } >> "$GITHUB_STEP_SUMMARY"
