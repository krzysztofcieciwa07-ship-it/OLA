name: OLA Isolated Worker Runtime

on:
  push:
    branches: ["**"]
    paths:
      - "app/agent_catalog.py"
      - "app/agent_protocol.py"
      - "app/agent_registry.py"
      - "app/agent_supervisor.py"
      - "app/agent_worker.py"
      - "workstation/worker.Dockerfile"
      - "workstation/agent-manifest.json"
      - "tests/test_agent_supervisor_docker_integration.py"
      - "tests/test_provenance_hardening.py"
      - "tests/test_agent_runtime_supervisor.py"
      - "tests/test_agent_supervisor.py"
      - "tests/test_docker_event_observer.py"
      - "tests/test_provider_gateway.py"
      - ".github/workflows/agent-worker-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/agent_catalog.py"
      - "app/agent_protocol.py"
      - "app/agent_registry.py"
      - "app/agent_supervisor.py"
      - "app/agent_worker.py"
      - "workstation/worker.Dockerfile"
      - "workstation/agent-manifest.json"
      - "tests/test_agent_supervisor_docker_integration.py"
      - "tests/test_provenance_hardening.py"
      - "tests/test_agent_runtime_supervisor.py"
      - "tests/test_agent_supervisor.py"
      - "tests/test_docker_event_observer.py"
      - "tests/test_provider_gateway.py"
      - ".github/workflows/agent-worker-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ola-worker-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install worker supervisor test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Resolve immutable Python base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python:3.13-slim
          BASE_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.13-slim)"
          if [[ ! "$BASE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve an immutable python:3.13-slim digest" >&2
            exit 1
          fi
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Resolved worker base: $BASE_IMAGE"

      - name: Build immutable worker image
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          docker build --pull=false \
            --file workstation/worker.Dockerfile \
            --build-arg "PYTHON_BASE_IMAGE=${{ steps.base.outputs.base_image }}" \
            --build-arg "OLA_SOURCE_COMMIT=$SOURCE_COMMIT" \
            --tag ola-agent-worker:ci .
          WORKER_IMAGE="$(docker image inspect --format '{{.Id}}' ola-agent-worker:ci)"
          if [[ ! "$WORKER_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Worker image did not resolve to an immutable image ID" >&2
            exit 1
          fi
          echo "OLA_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "OLA_AGENT_WORKER_IMAGE_DIGEST=$WORKER_IMAGE" >> "$GITHUB_ENV"
          echo "Worker image: $WORKER_IMAGE"
          echo "Worker source: $SOURCE_COMMIT"

      - name: Run focused provenance and Docker acceptance tests
        run: pytest -q tests/test_provenance_hardening.py tests/test_agent_runtime_supervisor.py tests/test_agent_supervisor.py tests/test_provider_gateway.py tests/test_docker_event_observer.py tests/test_agent_supervisor_docker_integration.py
