name: OLA paid-order PostgreSQL contract

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/migrate_postgres.py"
      - "tests/test_database_postgres_support.py"
      - "tests/test_postgres_integration.py"
      - "requirements.txt"
      - ".github/workflows/paid-order-postgres.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/migrate_postgres.py"
      - "tests/test_database_postgres_support.py"
      - "tests/test_postgres_integration.py"
      - "requirements.txt"
      - ".github/workflows/paid-order-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ola_test
          POSTGRES_PASSWORD: ola_test_only
          POSTGRES_DB: ola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ola_test -d ola_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OLA_TEST_POSTGRES_URL: postgresql+psycopg://ola_test:ola_test_only@localhost:5432/ola_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real PostgreSQL concurrency and append-only tests
        run: python -m pytest -q -o addopts='' tests/test_database_postgres_support.py tests/test_postgres_integration.py
