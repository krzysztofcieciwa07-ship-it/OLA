name: OLA paid-order PostgreSQL contract

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/migrate_postgres.py"
      - "tests/test_database_postgres_support.py"
      - "tests/test_postgres_integration.py"
      - "requirements.txt"
      - ".github/workflows/paid-order-postgres.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/migrate_postgres.py"
      - "tests/test_database_postgres_support.py"
      - "tests/test_postgres_integration.py"
      - "requirements.txt"
      - ".github/workflows/paid-order-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: ola_test
          POSTGRES_PASSWORD: ola_test_only
          POSTGRES_DB: ola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ola_test -d ola_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OLA_TEST_POSTGRES_URL: postgresql+psycopg://ola_test:ola_test_only@localhost:5432/ola_test
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout matches exact candidate source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::PostgreSQL test checkout mismatch: $actual != $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real PostgreSQL concurrency and append-only tests
        run: python -m pytest -q -o addopts='' tests/test_database_postgres_support.py tests/test_postgres_integration.py
