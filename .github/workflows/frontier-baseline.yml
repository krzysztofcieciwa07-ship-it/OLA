name: OLA Frontier Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      OLA_LLM_MODE: deterministic
      OLA_LLM_MODEL: deterministic-runtime-v1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Execute baseline benchmark
        run: python -m pytest -q tests/test_frontier_baseline.py -s | tee frontier-baseline.log
      - name: Publish baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ola-frontier-baseline-${{ github.sha }}
          path: frontier-baseline.log
