name: OLA Frontier Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      OLA_LLM_MODE: deterministic
      OLA_LLM_MODEL: deterministic-runtime-v1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Execute baseline benchmark
        run: python -m pytest -q tests/test_frontier_baseline.py -s | tee frontier-baseline.log
      - name: Publish baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-frontier-baseline-${{ github.sha }}
          path: frontier-baseline.log
