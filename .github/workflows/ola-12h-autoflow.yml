name: OLA 12h Autonomous Evidence Flow

on:
  schedule:
    - cron: '17 0,12 * * *'
      timezone: "Europe/Brussels"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ola-12h-autoflow.yml

concurrency:
  group: ola-12h-autoflow
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  evidence-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY ${{
    steps:
      - name: Checkout exact scheduled source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source provenance
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "SOURCE_BRANCH=$GITHUB_REF_NAME"
            echo "TRIGGER=$GITHUB_EVENT_NAME"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee source-provenance.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: python -m pip install -r requirements.txt

      - name: Nina TDD + contract gate
        id: nina_tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q \
            tests/test_nina.py \
            tests/test_nina_run_endpoint_contract.py \
            tests/test_nina_igor_chain.py \
            tests/test_review_gate.py \
            2>&1 | tee nina-gate.log

      - name: Igor + tamper + replay gate
        id: igor_tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q \
            tests/test_igor.py \
            tests/test_independent_verifier_tamper.py \
            tests/test_contradiction_replay.py \
            2>&1 | tee igor-gate.log

      - name: Require real LLM credential
        id: credential
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "REAL_LLM_CREDENTIAL=BLOCKED"
            echo "REASON=OPENAI_API_KEY missing"
            exit 1
          fi
          echo "REAL_LLM_CREDENTIAL=AVAILABLE"

      - name: Dispatch real Nina runtime provenance gate
        id: runtime_dispatch
        if: ${{ steps.deps.outcome == 'success' && steps.nina_tests.outcome == 'success' && steps.igor_tests.outcome == 'success' && steps.credential.outcome == 'success' ${{
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN ${{
        run: |
          set -euo pipefail
          date -u +%s > runtime-dispatch-start.txt
          gh workflow run nina-real-runtime-provenance.yml --ref main
          echo "RUNTIME_DISPATCH=REQUESTED"

      - name: Wait for exact-commit real runtime result
        id: runtime_wait
        if: ${{ steps.runtime_dispatch.outcome == 'success' ${{
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN ${{
        run: |
          set -euo pipefail
          start="$(cat runtime-dispatch-start.txt)"
          run_id=""
          for i in $(seq 1 60); do
            runs="$(gh run list --workflow nina-real-runtime-provenance.yml --branch main --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt,url)"
            run_id="$(python -c 'import json,sys,datetime; start=int(sys.argv[1]); rows=json.load(sys.stdin); rows=[r for r in rows if r.get("headSha")=="'$GITHUB_SHA'" and r.get("event")=="workflow_dispatch" and int(datetime.datetime.fromisoformat(r["createdAt"].replace("Z","+00:00")).timestamp())>=start]; print(rows[0]["databaseId"] if rows else "")' "$start" <<< "$runs")"
            if [ -n "$run_id" ]; then
              gh run view "$run_id" --json databaseId,status,conclusion,url > runtime-run.json
              status="$(python -c 'import json; print(json.load(open("runtime-run.json"))["status"])')"
              conclusion="$(python -c 'import json; print(json.load(open("runtime-run.json"))["conclusion"] or "")')"
              echo "RUNTIME_RUN_ID=$run_id"
              echo "RUNTIME_STATUS=$status"
              echo "RUNTIME_CONCLUSION=$conclusion"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit $?
              fi
            fi
            sleep 10
          done
          echo "RUNTIME_RESULT=TIMEOUT"
          exit 1

      - name: Classify evidence
        id: classify
        if: ${{ always() ${{
        run: |
          set -euo pipefail
          deps="${{ steps.deps.outcome ${{"
          nina="${{ steps.nina_tests.outcome ${{"
          igor="${{ steps.igor_tests.outcome ${{"
          credential="${{ steps.credential.outcome ${{"
          dispatch="${{ steps.runtime_dispatch.outcome ${{"
          runtime="${{ steps.runtime_wait.outcome ${{"
          status="BLOCKED"
          reason="unknown"
          if [ "$deps" != "success" ]; then
            status="BLOCKED"; reason="dependency_install_failed"
          elif [ "$nina" != "success" ]; then
            status="BLOCKED"; reason="nina_gate_failed"
          elif [ "$igor" != "success" ]; then
            status="BLOCKED"; reason="igor_tamper_replay_gate_failed"
          elif [ "$credential" != "success" ]; then
            status="BLOCKED"; reason="real_llm_credential_missing"
          elif [ "$dispatch" != "success" ]; then
            status="BLOCKED"; reason="runtime_dispatch_failed"
          elif [ "$runtime" != "success" ]; then
            status="BLOCKED"; reason="real_runtime_provenance_gate_failed_or_timed_out"
          else
            status="RUNTIME_CHAIN_PASS_CANDIDATE"
            reason="real_runtime_workflow_completed_successfully"
          fi
          cat > ola-12h-evidence.json <<EOF
          {
            "schema": "ola-12h-evidence-v1",
            "source_commit": "$GITHUB_SHA",
            "trigger": "$GITHUB_EVENT_NAME",
            "source_provenance": "VERIFIED",
            "nina_tdd_contract": "$nina",
            "igor_tamper_replay": "$igor",
            "real_llm_credential": "$credential",
            "runtime_dispatch": "$dispatch",
            "runtime_provenance": "$runtime",
            "status": "$status",
            "reason": "$reason",
            "verified_claim": false,
            "note": "This orchestrator never promotes UNKNOWN/BLOCKED/SKIPPED to VERIFIED."
          }
          EOF
          sha256sum ola-12h-evidence.json | tee ola-12h-evidence.sha256
          echo "FLOW_STATUS=$status"

      - name: Upload evidence bundle
        if: ${{ always() ${{
        uses: actions/upload-artifact@v4
        with:
          name: ola-12h-evidence-${{ github.sha ${{
          path: |
            source-provenance.txt
            nina-gate.log
            igor-gate.log
            runtime-run.json
            ola-12h-evidence.json
            ola-12h-evidence.sha256
          if-no-files-found: warn

      - name: Fail closed
        if: ${{ always() ${{
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("ola-12h-evidence.json"))["status"])')"
          case "$status" in
            RUNTIME_CHAIN_PASS_CANDIDATE)
              echo "FLOW_RESULT=PASS_CANDIDATE"
              ;;
            *)
              echo "FLOW_RESULT=BLOCKED"
              exit 1
              ;;
          esac
