name: OLA Security Controls Contract
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ola-security-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Security contracts
        run: python -m pytest -q tests/test_security_controls.py tests/test_request_and_freshness.py tests/test_llm_ecosystem.py
