name: Events outbox isolated tests
on:
  pull_request:
    paths:
      - 'ola_events/**'
      - 'tests/test_ola_events_outbox.py'
      - '.github/workflows/events-outbox-ci.yml'
  workflow_dispatch:
jobs:
  outbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_ola_events_outbox.py -q
