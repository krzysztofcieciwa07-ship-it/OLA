name: NINA IGOR Ollama Full Flow

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - feat/evidence-graph-v0.1

permissions:
  contents: read
  actions: read

env:
  # CI fixture only; NEVER use as a production secret.
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  OLA_API_KEY_PEPPER: ${{ github.event.pull_request.head.sha || github.sha }}
  OLA_LLM_PROVIDER: ollama
  OLA_LLM_MODE: required
  OLLAMA_MODEL: qwen2.5:0.5b-instruct
  OLA_LLM_MODEL: qwen2.5:0.5b-instruct
  OLA_LLM_TIMEOUT: "60"
  # Use a bounded real model response in all CI callers, including 12h workflow_call.
  OLA_OLLAMA_NUM_PREDICT: "96"

jobs:
  pr2-focused-tests:
    runs-on: ubuntu-latest
    env:
      # These tests are in-process unit/contract tests; they must not depend on a live Ollama service.
      OLA_LLM_PROVIDER: deterministic
      OLA_LLM_MODE: deterministic
      OLA_LLM_MODEL: deterministic-runtime-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout matches trusted source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Source checkout mismatch: $actual != $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run PR-2 focused tests
        run: pytest -q tests/test_nina_igor_chain.py tests/test_nina_run_endpoint_contract.py tests/test_ollama_igor_evidence_contract.py

  nina-igor-ollama-full-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert checkout matches trusted source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Source checkout mismatch: $actual != $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Set up Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
          curl --fail --silent http://127.0.0.1:11434/api/tags > ollama-models.json

      - name: Build OLA
        run: docker build --build-arg OLA_SOURCE_COMMIT="$(git rev-parse HEAD)" --tag ola-nina-ollama --file Dockerfile .

      - name: Start OLA
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm -e OLA_API_KEY_PEPPER="$OLA_API_KEY_PEPPER" \
            --name ola-nina-ollama \
            --network host \
            -e OLA_EG_DB_PATH=/data/ola.db \
            -e OLA_REQUIRE_BUILD_INFO=1 \
            -e OLA_BUILD_EXPECTED_SHA="$EXPECTED_SOURCE_SHA" \
            -e OLA_RUNTIME_COMMIT="0000000000000000000000000000000000000000" \
            -e OLA_LLM_PROVIDER="$OLA_LLM_PROVIDER" \
            -e OLA_LLM_MODE="$OLA_LLM_MODE" \
            -e OLA_LLM_MODEL="$OLA_LLM_MODEL" \
            -e OLLAMA_MODEL="$OLLAMA_MODEL" \
            -e OLLAMA_BASE_URL="http://127.0.0.1:11434" \
            -e OLA_LLM_TIMEOUT="$OLA_LLM_TIMEOUT" \
            -e OLA_OLLAMA_NUM_PREDICT="$OLA_OLLAMA_NUM_PREDICT" \
            ola-nina-ollama
          docker exec ola-nina-ollama sh -c 'test -r /app/ola-build-info.json && test ! -w /app/ola-build-info.json && test ! -w /app' \
            || { echo "BUILD_INFO_NOT_IMMUTABLE"; exit 1; }
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ola-nina-ollama
          exit 1

      - name: Run NINA to IGOR to provenance to replay
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ola-nina-ollama python - <<'PY' > nina-igor-ollama-proof.json
          from app.api_key_hashing import api_key_fingerprint
          from app.runtime_provenance import runtime_source_commit
          import hashlib
          import json
          import os
          import sqlite3
          import urllib.request
          import uuid

          tenant_id=str(uuid.uuid4())
          raw_key="ci-nina-ollama-key"
          db_path="/data/ola.db"
          db=sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id,name) VALUES (?,?)",(tenant_id,"ci-nina-ollama"))
          db.execute(
              "INSERT INTO api_keys(id,tenant_id,key_hash,role) VALUES (?,?,?,?)",
              (str(uuid.uuid4()),tenant_id,api_key_fingerprint(raw_key),"tenant"),
          )
          db.commit()
          db.close()

          task="Calculate 17 * 23 and return the exact verified result 391."
          request_body={
              "task":task,
              "requested_tools":["safe_expression"],
              "human_approved":False,
              "human_actor":"ci-machine",
              "human_reason":"human confirmation intentionally left pending in CI",
          }
          req=urllib.request.Request(
              "http://127.0.0.1:8000/nina-run",
              data=json.dumps(request_body).encode(),
              headers={"Content-Type":"application/json","X-API-Key":raw_key},
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=300) as resp:
              body=json.load(resp)

          runtime_commit=runtime_source_commit(require_build_info=True)
          assert runtime_commit == os.environ["OLA_BUILD_EXPECTED_SHA"], runtime_commit
          assert body["nina"]["status"]=="VERIFIED", body
          assert body["nina"]["provider"]=="ollama", body
          assert body["nina"]["model"]=="qwen2.5:0.5b-instruct", body
          assert body["nina"]["invocation_type"]=="real_llm", body
          assert body["nina"]["llm_invocations"]==6, body
          assert body["igor"]["status"]=="VERIFIED", body
          assert body["igor"]["checks"]["chain"] is True, body
          assert body["igor"]["checks"]["commit"] is True, body
          assert body["igor"]["checks"]["task"] is True, body
          assert body["igor"]["checks"]["result"] is True, body
          assert body["igor"]["checks"]["provider"] is True, body
          assert body["igor"]["checks"]["model"] is True, body
          assert body["provenance"]["status"]=="VERIFIED", body
          assert body["provenance"]["commit"]==runtime_commit, body
          assert body["provenance"]["provider"]=="ollama", body
          assert body["provenance"]["model"]=="qwen2.5:0.5b-instruct", body
          assert body["provenance"]["invocation_type"]=="real_llm", body
          assert body["provenance"]["llm_invocations"]==6, body
          assert len(body["provenance"]["response_ids"])==6, body
          assert body["replay_verification"]["status"]=="VERIFIED", body
          assert body["replay_verification"]["event_count"]==9, body
          assert len(body["replay"])==9, body
          expected_replay_types = [
              "execution.run.start",
              "agent.codeact",
              "agent.react",
              "agent.agentic_rag",
              "agent.mcp_tool_use",
              "agent.self_reflection",
              "agent.multi_agent",
              "execution.run.end",
              "provenance.runtime",
          ]
          assert [event["record_type"] for event in body["replay"]] == expected_replay_types, body["replay"]
          assert body["policy"]["status"]=="VERIFIED", body
          # HumanGate remains fail-closed until the separate approval endpoint is used.
          assert body["human_gate"]["status"]=="BLOCK", body
          assert body["status_fields"]["HUMAN_GATE"]=="REVIEW", body
          assert body["status_fields"]["EXECUTION_ALLOWED"]=="REVIEW", body
          assert body["status"]=="REVIEW", body

          proof={
              "status":body["status"],
              "status_fields":body["status_fields"],
              "flow":["NINA","REAL_OLLAMA_LLM","IGOR","PROVENANCE","REPLAY","HUMAN_GATE"],
              "provider":body["provenance"]["provider"],
              "model":body["provenance"]["model"],
              "llm_invocations":body["provenance"]["llm_invocations"],
              "nina_status":body["nina"]["status"],
              "igor_status":body["igor"]["status"],
              "provenance_status":body["provenance"]["status"],
              "replay_status":body["replay_verification"]["status"],
              "policy_status":body["policy"]["status"],
              "human_gate_status":body["human_gate"]["status"],
              "run_id":body["run_id"],
              "tenant_id":tenant_id,
              "commit":runtime_commit,
          }
          print(json.dumps(proof,sort_keys=True))
          with open("/data/nina-ollama-proof-context.json","w",encoding="utf-8") as stream:
              json.dump({"tenant_id":tenant_id,"run_id":body["run_id"],"task":task},stream,sort_keys=True)
          PY

      - name: Standalone verifier
        shell: bash
        run: |
          set -euo pipefail
          TENANT_ID=$(docker exec ola-nina-ollama python -c 'import json; print(json.load(open("/data/nina-ollama-proof-context.json"))["tenant_id"])')
          RUN_ID=$(docker exec ola-nina-ollama python -c 'import json; print(json.load(open("/data/nina-ollama-proof-context.json"))["run_id"])')
          docker exec ola-nina-ollama \
            python scripts/verify_agent_runtime.py \
              --tenant-id "$TENANT_ID" \
              --run-id "$RUN_ID" \
              --expected-commit "$EXPECTED_SOURCE_SHA" \
              --expected-task "Calculate 17 * 23 and return the exact verified result 391." \
              --expected-result "391" \
              --expected-provider "ollama" \
              --expected-model "$OLLAMA_MODEL" \
              --expected-invocation-type "real_llm"

      - name: Capture OLA flow evidence
        shell: bash
        run: |
          set -euo pipefail
          docker logs ola-nina-ollama > ola-nina-ollama-runtime.log 2>&1 || true

      - name: Export tenant-scoped evidence for independent IGOR
        shell: bash
        run: |
          set -euo pipefail
          docker cp ola-nina-ollama:/data/nina-ollama-proof-context.json ./nina-ollama-proof-context.json
          docker cp ola-nina-ollama:/app/ola-build-info.json ./ola-build-info.json
          docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ola-nina-ollama > runtime-image-revision.txt
          docker image inspect --format '{{.Id}}' ola-nina-ollama > runtime-image-id.txt
          test "$(cat runtime-image-revision.txt)" = "$EXPECTED_SOURCE_SHA"
          docker exec -i ola-nina-ollama python - <<'PY'
          import json, sqlite3
          context=json.load(open("/data/nina-ollama-proof-context.json",encoding="utf-8"))
          source=sqlite3.connect("/data/ola.db")
          rows=source.execute(
              "SELECT id,tenant_id,seq,record_type,payload_json,prev_hash,record_hash "
              "FROM evidence_records WHERE tenant_id=? ORDER BY seq",
              (context["tenant_id"],),
          ).fetchall()
          source.close()
          assert len(rows) >= 6, len(rows)
          target=sqlite3.connect("/tmp/nina-ollama-evidence.sqlite3")
          target.execute("""
              CREATE TABLE evidence_records (
                  id TEXT PRIMARY KEY,
                  tenant_id TEXT NOT NULL,
                  seq INTEGER NOT NULL,
                  record_type TEXT NOT NULL,
                  payload_json TEXT NOT NULL,
                  prev_hash TEXT NOT NULL,
                  record_hash TEXT NOT NULL
              )
          """)
          target.executemany(
              "INSERT INTO evidence_records VALUES (?,?,?,?,?,?,?)",
              rows,
          )
          target.commit()
          target.close()
          PY
          docker cp ola-nina-ollama:/tmp/nina-ollama-evidence.sqlite3 ./nina-ollama-evidence.sqlite3
          python - <<'PY'
          import json, os
          context=json.load(open("nina-ollama-proof-context.json",encoding="utf-8"))
          with open("provenance.txt","w",encoding="utf-8") as stream:
              stream.write(f"commit={os.environ['EXPECTED_SOURCE_SHA']}\n")
              stream.write(f"run={os.environ['GITHUB_RUN_ID']}\n")
              stream.write(f"tenant_id={context['tenant_id']}\n")
              stream.write(f"run_id={context['run_id']}\n")
              stream.write("provider=ollama\n")
              stream.write(f"model={os.environ['OLLAMA_MODEL']}\n")
          PY
          sha256sum ollama-models.json nina-igor-ollama-proof.json nina-ollama-proof-context.json nina-ollama-evidence.sqlite3 ola-nina-ollama-runtime.log provenance.txt ola-build-info.json runtime-image-revision.txt runtime-image-id.txt > evidence-files.sha256

      - name: Upload full-flow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nina-igor-ollama-full-flow-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ollama-models.json
            nina-igor-ollama-proof.json
            ola-nina-ollama-runtime.log
            nina-ollama-proof-context.json
            nina-ollama-evidence.sqlite3
            provenance.txt
            evidence-files.sha256
            ola-build-info.json
            runtime-image-revision.txt
            runtime-image-id.txt

      - name: Capture Ollama failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          docker logs ola-nina-ollama > nina-igor-runtime-failure.log 2>&1
          cp /tmp/ollama.log ollama-service-failure.log 2>/dev/null || true
          curl --fail --silent --max-time 5 http://127.0.0.1:11434/api/ps > ollama-processes-failure.json || true

      - name: Upload Ollama failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nina-igor-ollama-failure-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            nina-igor-runtime-failure.log
            ollama-service-failure.log
            ollama-processes-failure.json

      - name: Stop OLA
        if: always()
        run: docker rm --force ola-nina-ollama >/dev/null 2>&1 || true

  igor-independent-ollama:
    needs: nina-igor-ollama-full-flow
    if: ${{ needs.nina-igor-ollama-full-flow.result == 'success' }}
    uses: ./.github/workflows/igor-independent-ollama-evidence.yml
    with:
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      nina_artifact_name: nina-igor-ollama-full-flow-${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
