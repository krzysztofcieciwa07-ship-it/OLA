name: OLA Decision Fabric Gate

on:
  push:
    branches: [main, feat/decision-fabric-jev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Decision Fabric contract tests
        run: python -m pytest -q tests/test_decision_fabric.py
      - name: Compile
        run: python -m compileall -q app

  live-jev:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.provider.outputs.available }}
    steps:
      - name: Check optional provider availability
        id: provider
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "LIVE_JEV=NOT_PROVEN"
          fi
      - name: Checkout exact source
        if: steps.provider.outputs.available == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        if: steps.provider.outputs.available == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install
        if: steps.provider.outputs.available == 'true'
        run: python -m pip install -r requirements.txt
      - name: Live Jev decision
        if: steps.provider.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python - <<'PY'
          from app.decision_fabric import DecisionFabric
          fabric = DecisionFabric()
          result = fabric.evaluate(
              state={"task": "Classify evidence package."},
              questions={
                  "needs_review": {"type": "noul", "instructions": "Does this require human review?"},
                  "route": {"type": "choice", "instructions": "Which route?", "criteria": {"audit": "Evidence audit", "block": "Unsafe or unverifiable"}},
                  "risk": {"type": "score", "instructions": "How risky is promotion?", "criteria": ["low", "medium", "high"]},
              },
          )
          import json
          from pathlib import Path
          evidence = fabric.evidence(result)
          evidence["commit"] = "${{ github.sha }}"
          Path("jev-live-evidence.json").write_text(json.dumps(evidence, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, sort_keys=True))
          assert result.status == "READY", result.reason
          assert result.model == "jev-1.13.0", result.model
          PY
      - name: Hash live evidence
        if: steps.provider.outputs.available == 'true'
        run: sha256sum jev-live-evidence.json | tee jev-live-evidence.sha256
      - name: Upload live evidence
        if: steps.provider.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ola-jev-live-evidence-${{ github.sha }}
          path: |
            jev-live-evidence.json
            jev-live-evidence.sha256
          if-no-files-found: error

  evidence:
    if: ${{ always() }}
    needs: [contract, live-jev]
    runs-on: ubuntu-latest
    steps:
      - name: Decision gate summary
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          LIVE_RESULT: ${{ needs.live-jev.result }}
          LIVE_AVAILABLE: ${{ needs.live-jev.outputs.available }}
        run: |
          echo "CONTRACT_JOB=$CONTRACT_RESULT"
          echo "LIVE_JEV_JOB=$LIVE_RESULT"
          if [ "$CONTRACT_RESULT" != "success" ]; then exit 1; fi
          if [ "$LIVE_RESULT" != "success" ]; then exit 1; fi
          if [ "$LIVE_AVAILABLE" != "true" ]; then echo "LIVE_JEV=NOT_PROVEN"; else echo "LIVE_JEV=VERIFIED"; fi
