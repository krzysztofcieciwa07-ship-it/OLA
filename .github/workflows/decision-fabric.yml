name: OLA Decision Fabric Gate

on:
  push:
    branches: [main, feat/decision-fabric-jev]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Decision Fabric contract tests
        run: python -m pytest -q tests/test_decision_fabric.py
      - name: Compile
        run: python -m compileall -q app

  live-jev:
    runs-on: ubuntu-latest
    if: ${{ secrets.TYPESAFE_API_KEY != '' ${{
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Live Jev decision
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY ${{
        run: |
          python - <<'PY'
          from app.decision_fabric import DecisionFabric
          fabric = DecisionFabric()
          result = fabric.evaluate(
              state={"task": "Classify whether this evidence package requires human review."},
              questions={
                  "needs_review": {
                      "type": "noul",
                      "instructions": "Does this evidence package require human review before promotion?",
                  },
                  "route": {
                      "type": "choice",
                      "instructions": "Which route should handle this package?",
                      "criteria": {
                          "audit": "Evidence audit and verification",
                          "block": "Unsafe, incomplete, or unverifiable work",
                      },
                  },
              },
          )
          print(fabric.evidence(result))
          assert result.status == "READY", result.reason
          assert result.model == "jev-1.13.0", result.model
          PY

  evidence:
    if: ${{ always() ${{
    needs: [contract, live-jev]
    runs-on: ubuntu-latest
    steps:
      - name: Decision gate summary
        run: |
          echo "CONTRACT_JOB=${{ needs.contract.result ${{"
          echo "LIVE_JEV_JOB=${{ needs.live-jev.result ${{"
          if [ "${{ needs.contract.result ${{" != "success" ]; then exit 1; fi
          if [ "${{ needs.live-jev.result ${{" = "failure" ]; then exit 1; fi
          if [ "${{ needs.live-jev.result ${{" = "skipped" ]; then
            echo "LIVE_JEV=NOT_PROVEN — TYPESAFE_API_KEY is not configured"
          else
            echo "LIVE_JEV=VERIFIED"
          fi
