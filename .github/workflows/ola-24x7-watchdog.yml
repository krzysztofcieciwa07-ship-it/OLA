name: OLA 24x7 Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: "Europe/Brussels"
  workflow_dispatch:

concurrency:
  group: ola-24x7-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect runtime health for exact main SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA"
          gh run list --workflow ola-12h-autoflow.yml --branch main --limit 100 --json databaseId,status,conclusion,createdAt,updatedAt,headSha > autoflow-runs.json
          python - <<'PY'
          import json
          rows=json.load(open("autoflow-runs.json", encoding="utf-8"))
          print("AUTOFLOW_RUNS_FETCHED", len(rows))
          for r in rows:
              print({
                  "headSha": r.get("headSha"),
                  "status": r.get("status"),
                  "conclusion": r.get("conclusion"),
                  "createdAt": r.get("createdAt"),
              })
          PY

      - name: Run local quality smoke gate
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          pytest -q tests/test_decision_report.py tests/test_igor.py tests/test_independent_verifier_tamper.py tests/test_contradiction_replay.py

      - name: Dispatch full evidence flow only when exact-SHA health is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          set +e
          python scripts/ola_watchdog_decision.py \
            --target-sha "$TARGET_SHA" \
            --runs-file autoflow-runs.json \
            --max-success-age 12h \
            --cooldown 15m
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            gh workflow run ola-12h-autoflow.yml --ref main
          elif [ "$status" -eq 2 ]; then
            exit 0
          else
            exit "$status"
          fi

      - name: Record provider policy
        run: |
          echo "24x7 watchdog active"
          echo "AUTO_PROVIDER=ollama"
          echo "OPENAI_REQUIRED_FOR_AUTO_FLOW=false"
          echo "OpenAI remains an optional separate verification lane."

      - name: Watchdog result
        if: ${{ always() }}
        run: |
          echo "OLA_24X7_WATCHDOG=ACTIVE"
          echo "No UNKNOWN/BLOCKED result is promoted to VERIFIED."
