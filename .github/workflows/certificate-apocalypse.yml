name: OLA Certificate Apocalypse Chaos Gate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-apocalypse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "2.3.0"

      - name: Install lab validation dependency
        run: python -m pip install -r requirements.txt -r scenarios/certificate-apocalypse/requirements-chaos.txt

      - name: Validate DSL and compile Python
        run: |
          set -euo pipefail
          python scripts/chaos/validate_scenario.py
          python -m compileall -q scripts/chaos scenarios/certificate-apocalypse/server.py tests/test_chaos_scenario_contract.py

      - name: Contract tests
        run: python -m pytest -q tests/test_chaos_scenario_contract.py

      - name: Execute actual certificate failure and recovery
        run: make scenario

      - name: Verify evidence manifest signature
        if: success()
        run: |
          set -euo pipefail
          REPORT_DIR="$(find scenarios/certificate-apocalypse/runs -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$REPORT_DIR"
          openssl pkeyutl -verify -pubin -inkey "$REPORT_DIR/evidence-manifest.pub" \
            -rawin -in "$REPORT_DIR/evidence-manifest.json" \
            -sigfile "$REPORT_DIR/evidence-manifest.sig"

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-certificate-apocalypse
          path: scenarios/certificate-apocalypse/runs/
          if-no-files-found: warn
          retention-days: 30
