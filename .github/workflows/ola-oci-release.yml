name: OLA OCI Release Chain

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app/**
      - scripts/**
      - tests/**
      - web/**
      - .github/workflows/ola-oci-release.yml
  push:
    branches:
      - main
      - security/oci-release-chain-20261112
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app/**
      - scripts/**
      - tests/**
      - web/**
      - .github/workflows/ola-oci-release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ola-oci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source checkout
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Source mismatch: checkout=$checked_out expected=$EXPECTED_SOURCE_SHA"
            exit 1
          fi
          echo "sha=$checked_out" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$checked_out"

      - name: Test release attestation policy
        run: python -m unittest discover -s tests -p 'test_oci_attestation.py' -v
      - name: Test fail-closed release gate policy
        run: python -m unittest discover -s tests -p 'test_release_gates.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build OCI image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            OLA_SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.title=OLA di-OS

  publish-attested:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/security/oci-release-chain-20261112' && github.actor == 'krzysztofcieciwa07-ship-it')) }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/krzysztofcieciwa07-ship-it/ola-di-os
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source checkout
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Source mismatch: checkout=$checked_out expected=$EXPECTED_SOURCE_SHA"
            exit 1
          fi
          echo "sha=$checked_out" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$checked_out"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Wait for full exact-source evidence gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/verify_release_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --timeout-seconds 1800 \
            --poll-seconds 15 \
            --output ola-release-gate-status.json

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable OCI image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            OLA_SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.title=OLA di-OS

      - name: Pull exact OCI digest and verify embedded source binding
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          label_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          test "$label_sha" = "$EXPECTED_SOURCE_SHA"
          build_info_sha="$(docker run --rm --entrypoint python "$IMAGE_REF" -c 'import json; print(json.load(open("/app/ola-build-info.json", encoding="utf-8"))["source_commit"])')"
          test "$build_info_sha" = "$EXPECTED_SOURCE_SHA"
          echo "PUBLISHED_IMAGE_SOURCE_LABEL=VERIFIED"
          echo "PUBLISHED_IMAGE_BUILD_INFO=VERIFIED"

      - name: Run readiness contract tests inside the published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE_REF" -m pytest -q tests/test_core_readiness.py
          echo "PUBLISHED_IMAGE_RUNTIME_SMOKE=VERIFIED"

      - name: Trivy scan exact published OCI digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Attest exact OCI image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify exact image, signer and source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/verify_oci_attestation.py \
            --image "$IMAGE_NAME" \
            --digest "${{ steps.image.outputs.digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ola-oci-release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-sha "${{ steps.source.outputs.sha }}"

      - name: Prove fail-closed behavior for digest, source and signer mutations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expect_block() {
            local label="$1"
            shift
            if python scripts/verify_oci_attestation.py \
              --image "$IMAGE_NAME" \
              --repository "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              "$@"; then
              echo "::error::Negative mutation was accepted: $label"
              exit 1
            fi
            echo "NEGATIVE_TEST_$label=BLOCKED"
          }

          if [[ "${RELEASE_DIGEST: -1}" == "0" ]]; then
            wrong_last="1"
          else
            wrong_last="0"
          fi
          wrong_digest="${RELEASE_DIGEST%?}${wrong_last}"
          expect_block DIGEST_MISMATCH \
            --digest "$wrong_digest" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ola-oci-release.yml" \
            --source-sha "$SOURCE_SHA"

          if [[ "${SOURCE_SHA:0:1}" == "0" ]]; then
            wrong_first="1"
          else
            wrong_first="0"
          fi
          wrong_source="${wrong_first}${SOURCE_SHA:1}"
          expect_block SOURCE_COMMIT_MISMATCH \
            --digest "$RELEASE_DIGEST" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ola-oci-release.yml" \
            --source-sha "$wrong_source"

          expect_block SIGNER_WORKFLOW_MISMATCH \
            --digest "$RELEASE_DIGEST" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/not-the-release-workflow.yml" \
            --source-sha "$SOURCE_SHA"

      - name: Write immutable release evidence manifest
        env:
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          image = os.environ["IMAGE_NAME"]
          digest = os.environ["RELEASE_DIGEST"]
          source_sha = os.environ["SOURCE_SHA"]
          manifest = {
              "schema": "ola-oci-release-evidence/v1",
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_commit_sha": source_sha,
              "image": image,
              "image_digest": digest,
              "image_ref": f"{image}@{digest}",
              "required_ci_gates": "VERIFIED",
              "published_image_source_binding": "VERIFIED",
              "published_image_runtime_smoke": "VERIFIED",
              "published_image_vulnerability_scan": "VERIFIED",
              "attestation": "VERIFIED",
              "negative_tests": {
                  "digest_mismatch": "BLOCKED",
                  "source_commit_mismatch": "BLOCKED",
                  "signer_workflow_mismatch": "BLOCKED"
              },
              "deployment": "NOT_TRIGGERED",
              "human_gate": "PENDING"
          }
          with open("ola-oci-release-manifest.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          sha256sum ola-oci-release-manifest.json | tee ola-oci-release-manifest.sha256

      - name: Upload OCI release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-oci-release-${{ steps.source.outputs.sha }}
          path: |
            ola-oci-release-manifest.json
            ola-oci-release-manifest.sha256
            ola-release-gate-status.json
            trivy-image-results.sarif
          if-no-files-found: error
          retention-days: 90
