name: OLA DORA Audit Evidence Pack

on:
  pull_request:
    paths:
      - "products/ola-dora-audit-evidence-pack/v0.1/**"
      - ".github/workflows/dora-audit-evidence-pack.yml"
  push:
    branches: [main]
    paths:
      - "products/ola-dora-audit-evidence-pack/v0.1/**"
      - ".github/workflows/dora-audit-evidence-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate pack and build deterministic archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: products/ola-dora-audit-evidence-pack/v0.1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/ola-dora-audit-evidence-pack/v0.1/requirements.txt
      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate intentionally incomplete demonstration bundle
        run: |
          set -euo pipefail
          python scripts/verify_pack.py examples/unverified-demo-bundle.json | tee "$RUNNER_TEMP/demo-validation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          with (Path(os.environ["RUNNER_TEMP"]) / "demo-validation.json").open(encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["valid_contract"] is True, result
          assert result["ready"] is False, result
          assert result["state_counts"]["UNKNOWN"] == 13, result
          print("DEMO_BUNDLE=VALID_BUT_NOT_READY")
          PY
      - name: Build the primary Evidence Manifest
        run: |
          set -euo pipefail
          python scripts/build_manifest.py examples/unverified-demo-bundle.json --output "$RUNNER_TEMP/demo-evidence-manifest.json"
          python - "$RUNNER_TEMP/demo-evidence-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest["schema_version"] == "ola.evidence-manifest.v0.1", manifest
          assert manifest["evaluation"]["status"] == "NOT_READY", manifest
          assert manifest["summary"]["control_state_counts"]["UNKNOWN"] == 13, manifest
          assert manifest["manifest_digest"].startswith("sha256:"), manifest
          print("EVIDENCE_MANIFEST=GENERATED_AND_FAIL_CLOSED")
          PY
      - name: Run contract and negative tests
        run: python -m pytest -q
      - name: Build deterministic distribution ZIP
        run: python scripts/build_pack.py --output dist/ola-dora-audit-evidence-pack-v0.1.0.zip
      - name: Upload pack archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ola-dora-audit-evidence-pack-v0.1.0
          path: products/ola-dora-audit-evidence-pack/v0.1/dist/ola-dora-audit-evidence-pack-v0.1.0.zip
          if-no-files-found: error
          retention-days: 30

  attest-pack-release:
    name: Sign and verify pack ZIP provenance
    needs: validate-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download validated archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ola-dora-audit-evidence-pack-v0.1.0
          path: dist
      - name: Generate GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ola-dora-audit-evidence-pack-v0.1.0.zip
      - name: Verify generated attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/ola-dora-audit-evidence-pack-v0.1.0.zip --repo "${GITHUB_REPOSITORY}"
