name: OLA Supply Chain Evidence Gate

on:
  push:
    branches: [main, feat/ola-evidence-supply-chain-20261001]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Static supply-chain security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@e8e61e86ea0a152be84d03729c02a7300065c17d # reviewed 2026-08-08
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          version: v1.30.1
      - name: Record zizmor evidence
        run: echo "VERIFIED" > zizmor.verified
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
      - name: Record Gitleaks evidence
        run: echo "VERIFIED" > gitleaks.verified
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # trivy v0.74.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@6b31fa7e2d592e47d95d2a5e0520a7352d47ead5 # reviewed 2026-09-25
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-static-security-evidence-${{ github.sha }}
          path: |
            scorecard.json
            trivy.json
            sbom.spdx.json
            zizmor.verified
            gitleaks.verified
          if-no-files-found: ignore

  build-attest-verify:
    name: Build + attestation + verification
    needs: static-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Build exact-source image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          docker build --tag "ola-evidence:${GITHUB_SHA}" .
          docker save "ola-evidence:${GITHUB_SHA}" -o ola-image.tar
          sha256sum ola-image.tar > ola-image.tar.sha256
      - name: Generate SBOM from exact image
        uses: anchore/sbom-action@6b31fa7e2d592e47d95d2a5e0520a7352d47ead5 # reviewed 2026-09-25
        with:
          image: "ola-evidence:${{ github.sha }}"
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-image.spdx.json
      - name: Verify image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # trivy v0.74.0
        with:
          image-ref: "ola-evidence:${{ github.sha }}"
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Create signed provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest 4.2.2
        with:
          subject-path: ola-image.tar
          predicate-type: https://slsa.dev/provenance/v1
      - name: Verify artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify ola-image.tar --repo "${GITHUB_REPOSITORY}"
          echo "ARTIFACT_ATTESTATION=VERIFIED"
          echo "SLSA_PROVENANCE=VERIFIED"
          echo "SIGSTORE_SIGNATURE=VERIFIED"
          echo "VERIFIED" > attestation.verified
          echo "VERIFIED" > slsa.verified
          echo "VERIFIED" > sigstore.verified
          echo "VERIFIED" > in-toto.verified
          echo "ARTIFACT_ATTESTATION=VERIFIED"
          echo "SLSA_PROVENANCE=VERIFIED"
          echo "SIGSTORE_SIGNATURE=VERIFIED"
          echo "IN_TOTO_ATTESTATION=VERIFIED"
      - name: Build evidence manifest
        run: |
          set -euo pipefail
          python scripts/verify_supply_chain_evidence.py --root . --commit "${GITHUB_SHA}" --output security-evidence-manifest.json
          sha256sum security-evidence-manifest.json
      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-evidence-${{ github.sha }}
          path: |
            ola-image.tar
            ola-image.tar.sha256
            sbom.spdx.json
            trivy-image.json
            security-evidence-manifest.json

  final-integrity-contract:
    name: OLA evidence contract
    needs: build-attest-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run local contract suite
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_supply_chain_evidence.py
          python -m compileall -q app scripts
          echo "OLA_SUPPLY_CHAIN_CONTRACT=READY"
