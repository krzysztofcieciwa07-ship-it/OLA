name: Crypto payment monitor tests
on:
  pull_request:
    paths:
      - 'crypto_payment_monitor/**'
      - 'docs/crypto-payment-monitor.md'
      - '.github/workflows/crypto-monitor-tests.yml'
  push:
    branches: [main, feat/noncustodial-crypto-payment-monitor]
    paths:
      - 'crypto_payment_monitor/**'
      - 'docs/crypto-payment-monitor.md'
      - '.github/workflows/crypto-monitor-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s crypto_payment_monitor/tests -v
