name: crypto-monitor-tests
on:
  pull_request:
    paths:
      - 'crypto_payment_monitor/**'
      - 'docs/crypto-payment-monitor.md'
  push:
    branches: [main]
    paths:
      - 'crypto_payment_monitor/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s crypto_payment_monitor/tests -v
