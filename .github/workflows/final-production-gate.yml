name: OLA FINAL PRODUCTION GATE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  final-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    steps:
      - name: Resolve target source SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert checkout is the exact release source
        shell: bash
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$TARGET_SOURCE_SHA" ]; then
            echo "::error::Release source mismatch: $checked_out != $TARGET_SOURCE_SHA"
            exit 1
          fi

      - name: Enforce exact-source security checkout contract
        run: python -m unittest discover -s tests -p "test_release_source_binding.py"

      - name: Verify required evidence gates
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${{ steps.target.outputs.sha }}"
          event_filter=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request) event_filter="&event=pull_request" ;;
            push) event_filter="&event=push&branch=main" ;;
            workflow_dispatch) event_filter="&branch=${GITHUB_REF_NAME}" ;;
          esac
          # Producer DAG gate permits up to 25 min; cover it plus queue latency.
          max_attempts=120
          sleep_seconds=15

          for attempt in $(seq 1 "$max_attempts"); do
            echo "GATE_POLL_ATTEMPT=$attempt/$max_attempts"

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${target_sha}${event_filter}&per_page=100" \
              > required-runs.json

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=100" \
              > reference-runs.json

            if python - <<'PY'
          import json
          import os
          import sys

          required_exact = [
              "Evidence Cryptography V4 Contract",
              "OLA paid-order PostgreSQL contract",
              "Python package CI",
              "OLA Local Staging Rehearsal",
              "Nina TDD",
              "NINA Parallel DAG Gate",
              "OLA Supply Chain Evidence Gate",
              "OLA CodeQL",
              "OLA DI-OS Product Gate",
              "OLA 12h Autonomous Evidence Flow",
              "OLA Decision Evidence Gate",
              "Revenue Surface Gate",
              "OLA E2E Gate",
              "Evidence Graph v0.1",
              "Real LLM Ollama Runtime Gate",
              "Provenance Mutation Gate",
              "Provenance Gate Final",
              "Nina Igor Gate",
              "Nina Real Runtime Provenance Gate (OpenAI optional)",
              "OLA State Continuity and Stability",
              "OLA Real Runtime Stress Gate",
          ]
          required_reference = [
              "OLA Frontier Baseline",
          ]

          with open("required-runs.json", encoding="utf-8") as stream:
              exact_data = json.load(stream)
          with open("reference-runs.json", encoding="utf-8") as stream:
              reference_data = json.load(stream)

          # GitHub can return runs for the same commit from several branches
          # and PRs. Bind every producer run to this release event context.
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          target_sha = os.environ.get("TARGET_SOURCE_SHA", "")
          target_branch = os.environ.get("GITHUB_REF_NAME", "")
          pr_number = int(os.environ.get("PR_NUMBER", "0"))

          def belongs_to_target_context(run):
              if run.get("head_sha") != target_sha:
                  return False
              if event_name == "push":
                  return run.get("event") == "push" and run.get("head_branch") == "main"
              if event_name == "pull_request":
                  if run.get("event") != "pull_request":
                      return False
                  for associated_pr in run.get("pull_requests", []):
                      if int(associated_pr.get("number") or 0) != pr_number:
                          continue
                      head = associated_pr.get("head") or {}
                      base = associated_pr.get("base") or {}
                      if head.get("sha") == target_sha and base.get("ref") == "main":
                          return True
                  return False
              if event_name == "workflow_dispatch":
                  return (
                      run.get("head_branch") == target_branch
                      and run.get("event") in {"push", "schedule", "workflow_dispatch"}
                  )
              return False

          exact_data["workflow_runs"] = [
              run for run in exact_data.get("workflow_runs", [])
              if belongs_to_target_context(run)
          ]

          expected_workflow_paths = {
              "Evidence Cryptography V4 Contract": ".github/workflows/evidence-cryptography-v4.yml",
              "OLA paid-order PostgreSQL contract": ".github/workflows/paid-order-postgres.yml",
              "Python package CI": ".github/workflows/python-package-conda.yml",
              "OLA Local Staging Rehearsal": ".github/workflows/staging-rehearsal.yml",
              "Nina TDD": ".github/workflows/nina-tdd.yml",
              "NINA Parallel DAG Gate": ".github/workflows/nina-parallel-dag.yml",
              "OLA Supply Chain Evidence Gate": ".github/workflows/supply-chain-evidence.yml",
              "OLA CodeQL": ".github/workflows/codeql.yml",
              "OLA DI-OS Product Gate": ".github/workflows/ola-product-gate.yml",
              "OLA 12h Autonomous Evidence Flow": ".github/workflows/ola-12h-autoflow.yml",
              "OLA Decision Evidence Gate": ".github/workflows/decision-evidence-gate.yml",
              "Revenue Surface Gate": ".github/workflows/revenue-surface.yml",
              "OLA E2E Gate": ".github/workflows/e2e.yml",
              "Evidence Graph v0.1": ".github/workflows/evidence-graph.yml",
              "Real LLM Ollama Runtime Gate": ".github/workflows/ollama-real-runtime.yml",
              "Provenance Mutation Gate": ".github/workflows/provenance-mutation.yml",
              "Provenance Gate Final": ".github/workflows/provenance-gate-final.yml",
              "Nina Igor Gate": ".github/workflows/nina-igor-gate.yml",
              "Nina Real Runtime Provenance Gate (OpenAI optional)": ".github/workflows/nina-real-runtime-provenance.yml",
              "OLA State Continuity and Stability": ".github/workflows/state-continuity.yml",
              "OLA Real Runtime Stress Gate": ".github/workflows/runtime-stress.yml",
              "OLA Frontier Baseline": ".github/workflows/frontier-baseline.yml",
          }

          def newest_by_name(data):
              newest = {}
              for run in data.get("workflow_runs", []):
                  name = run.get("name")
                  expected_path = expected_workflow_paths.get(name)
                  if not expected_path or run.get("path") != expected_path:
                      continue
                  if name and name not in newest:
                      newest[name] = {
                          "id": run.get("id"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_sha": run.get("head_sha"),
                          "event": run.get("event"),
                          "html_url": run.get("html_url"),
                      }
              return newest

          exact = newest_by_name(exact_data)
          reference = newest_by_name(reference_data)

          observed_exact = {name: exact.get(name) for name in required_exact}
          observed_reference = {name: reference.get(name) for name in required_reference}

          # The 12h workflow is the single PR/main orchestrator. NINA and
          # independent IGOR are reusable jobs nested inside that exact-SHA
          # run; the classify job verifies the three evidence artifacts.
          autoflow_run = exact.get("OLA 12h Autonomous Evidence Flow")
          nested_gates = {
              "NINA IGOR Ollama Full Flow": "real_ollama_flow / nina-igor-ollama-full-flow",
              "IGOR Independent Ollama Evidence Gate": "real_ollama_flow / igor-independent-ollama / igor-ollama",
              "OLA 12h Preflight": "preflight",
              "OLA 12h Evidence Aggregator": "classify",
          }
          for gate_name in nested_gates:
              observed_exact[gate_name] = None

          if autoflow_run is not None:
              import os
              import urllib.request
              jobs_url = (
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{autoflow_run['id']}/jobs?per_page=100"
              )
              request = urllib.request.Request(
                  jobs_url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  jobs_data = json.load(response)

              jobs_by_name = {}
              for job in jobs_data.get("jobs", []):
                  jobs_by_name.setdefault(job.get("name"), job)

              for gate_name, job_name in nested_gates.items():
                  job = jobs_by_name.get(job_name)
                  if job is not None:
                      observed_exact[gate_name] = {
                          "id": job.get("id"),
                          "status": job.get("status"),
                          "conclusion": job.get("conclusion"),
                          "head_sha": autoflow_run.get("head_sha"),
                          "html_url": job.get("html_url"),
                      }


          missing = [name for name, run in {**observed_exact, **observed_reference}.items() if run is None]
          pending = {
              name: run
              for name, run in {**observed_exact, **observed_reference}.items()
              if run is not None and run.get("status") != "completed"
          }
          failed = {
              name: run
              for name, run in {**observed_exact, **observed_reference}.items()
              if run is not None
              and run.get("status") == "completed"
              and run.get("conclusion") != "success"
          }

          status = {
              "exact_source_gates": observed_exact,
              "reference_gates": observed_reference,
              "missing": missing,
              "pending": pending,
              "failed": failed,
          }
          with open("gate-status.json", "w", encoding="utf-8") as stream:
              json.dump(status, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(status, indent=2, sort_keys=True))

          if failed:
              print("FAILED_REQUIRED_GATES=" + ",".join(sorted(failed)), file=sys.stderr)
              raise SystemExit(2)
          if missing or pending:
              raise SystemExit(10)
          print("ALL_REQUIRED_EVIDENCE_GATES=SUCCESS")
          PY
            then
              gate_rc=0
            else
              gate_rc=$?
            fi

            if [ "$gate_rc" -eq 0 ]; then
              break
            fi
            if [ "$gate_rc" -eq 2 ]; then
              echo "A required evidence gate completed unsuccessfully."
              exit 1
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Timed out waiting for required evidence gates."
              exit 1
            fi
            sleep "$sleep_seconds"
          done

      - name: Build release image
        run: docker build --build-arg OLA_SOURCE_COMMIT="$(git rev-parse HEAD)" -t ola-final:${{ steps.target.outputs.sha }} .

      - name: Assert release image source label
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ola-final:${TARGET_SOURCE_SHA})"
          test "$image_source" = "$TARGET_SOURCE_SHA"

      - name: Export release image
        run: docker save "ola-final:${{ steps.target.outputs.sha }}" -o ola-release-image.tar

      - name: Create source snapshot subjects
        run: |
          git archive --format=tar.gz --output=ola-source-${{ steps.target.outputs.sha }}.tar.gz "${{ steps.target.outputs.sha }}"
          sha256sum "ola-source-${{ steps.target.outputs.sha }}.tar.gz" | tee source-sha256.txt
          sha256sum ola-release-image.tar | tee image-sha256.txt

      - name: Verify release image source-bound readiness
        shell: bash
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          pepper="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$pepper"
          docker run -d --name ola-final-gate \
            -e OLA_REQUIRE_BUILD_INFO=1 \
            -e OLA_RUNTIME_COMMIT=0000000000000000000000000000000000000000 \
            -e OLA_API_KEY_PEPPER="$pepper" \
            -e OLA_EVIDENCE_V4_KEYRING_JSON='{"ci-v4-2026":"cHl0ZXN0LW9ubHktdjQta2V5LW1hdGVyaWFsLTMyYnl0ZXMhIQ=="}' \
            -e OLA_EVIDENCE_V4_ACTIVE_KEY_ID=ci-v4-2026 \
            -p 8000:8000 "ola-final:$TARGET_SOURCE_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz | TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" python -c '
          import json, os, sys
          body=json.load(sys.stdin)
          assert body.get("core_status") == "READY", body
          assert body.get("system_acceptance") == "NOT_VERIFIED", body
          assert body.get("source_commit") == os.environ["TARGET_SOURCE_SHA"], body
          assert body.get("failed_checks") == [], body
          '; then
              echo "RELEASE_IMAGE_SOURCE_BINDING=VERIFIED"
              exit 0
            fi
            sleep 2
          done
          docker logs ola-final-gate
          exit 1

      - name: Generate final production manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="BLOCKED"
          source_attestation="NOT_PERFORMED"
          image_attestation="NOT_PERFORMED"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "${{ job.status }}" = "success" ]; then
            status="RELEASE_GATES_PASSED_PENDING_ATTESTATION"
            source_attestation="PENDING_MAIN_ONLY_ATTESTATION_JOB"
            image_attestation="PENDING_MAIN_ONLY_ATTESTATION_JOB"
          elif [ "${{ job.status }}" = "success" ]; then
            status="PREMERGE_CI_PASSED"
          fi
          cat > production-manifest.json <<EOF
          {
            "schema": "ola-production-evidence-v1",
            "commit": "${{ steps.target.outputs.sha }}",
            "source_snapshot": "ola-source-${{ steps.target.outputs.sha }}.tar.gz",
            "release_image": "ola-release-image.tar",
            "source_attestation": "${source_attestation}",
            "image_attestation": "${image_attestation}",
            "required_gates": ["ci","state-continuity","stability","provenance","signatures","real-runtime","stress","tamper","replay","human-gate"],
            "final_status": "${status}"
          }
          EOF
          sha256sum production-manifest.json | tee production-manifest-sha256.txt

      - name: Publish final production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-final-production-candidate-${{ steps.target.outputs.sha }}
          path: |
            required-runs.json
            reference-runs.json
            gate-status.json
            production-manifest.json
            production-manifest-sha256.txt
            source-sha256.txt
            image-sha256.txt
            ola-source-${{ steps.target.outputs.sha }}.tar.gz
            ola-release-image.tar

      - name: Cleanup
        if: always()
        run: docker rm -f ola-final-gate >/dev/null 2>&1 || true

  attest-production:
    name: Attest final production source and image (main only)
    needs: final-production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.final-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact main source for the verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download source and image candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ola-final-production-candidate-${{ github.sha }}
          path: candidate

      - name: Verify candidate hashes and source binding before attestation
        env:
          TARGET_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd candidate
            sha256sum -c source-sha256.txt
            sha256sum -c image-sha256.txt
          )
          TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("candidate/production-manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("commit") == os.environ["TARGET_SOURCE_SHA"], manifest
          assert manifest.get("final_status") == "RELEASE_GATES_PASSED_PENDING_ATTESTATION", manifest
          PY

      - name: Attest source snapshot
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate/ola-source-${{ github.sha }}.tar.gz

      - name: Attest release image archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate/ola-release-image.tar

      - name: Independently verify source and image attestations against exact SHA and workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/final-production-gate.yml
          EXPECTED_WORKFLOW_REF: refs/heads/main
          EXPECTED_WORKFLOW_NAME: OLA FINAL PRODUCTION GATE
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify --format json --repo "$EXPECTED_REPOSITORY" \
            "candidate/ola-source-$TARGET_SOURCE_SHA.tar.gz" > candidate/source-attestation.json
          gh attestation verify --format json --repo "$EXPECTED_REPOSITORY" \
            candidate/ola-release-image.tar > candidate/image-attestation.json

          python scripts/verify_supply_chain_attestation.py \
            --attestation candidate/source-attestation.json \
            --subject "candidate/ola-source-$TARGET_SOURCE_SHA.tar.gz" \
            --expected-source-sha "$TARGET_SOURCE_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-workflow-path "$EXPECTED_WORKFLOW_PATH" \
            --expected-workflow-ref "$EXPECTED_WORKFLOW_REF" \
            --expected-workflow-name "$EXPECTED_WORKFLOW_NAME" \
            > candidate/source-attestation-verification.json

          python scripts/verify_supply_chain_attestation.py \
            --attestation candidate/image-attestation.json \
            --subject candidate/ola-release-image.tar \
            --expected-source-sha "$TARGET_SOURCE_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-workflow-path "$EXPECTED_WORKFLOW_PATH" \
            --expected-workflow-ref "$EXPECTED_WORKFLOW_REF" \
            --expected-workflow-name "$EXPECTED_WORKFLOW_NAME" \
            > candidate/image-attestation-verification.json

      - name: Generate final attested production manifest
        if: always()
        env:
          TARGET_SOURCE_SHA: ${{ github.sha }}
          ATTESTATION_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          status="BLOCKED"
          source_attestation="NOT_VERIFIED"
          image_attestation="NOT_VERIFIED"
          if [ "$ATTESTATION_JOB_STATUS" = "success" ]; then
            status="ATTESTED_PENDING_HUMAN"
            source_attestation="VERIFIED_BY_GITHUB_ACTIONS_ATTESTATION"
            image_attestation="VERIFIED_BY_GITHUB_ACTIONS_ATTESTATION"
          fi
          cat > candidate/final-production-manifest.json <<EOF
          {
            "schema": "ola-production-evidence-v1",
            "commit": "$TARGET_SOURCE_SHA",
            "source_snapshot": "ola-source-$TARGET_SOURCE_SHA.tar.gz",
            "release_image": "ola-release-image.tar",
            "source_attestation": "$source_attestation",
            "image_attestation": "$image_attestation",
            "required_gates": ["ci","state-continuity","stability","provenance","signatures","real-runtime","stress","tamper","replay","human-gate"],
            "final_status": "$status"
          }
          EOF
          sha256sum candidate/final-production-manifest.json | tee candidate/final-production-manifest-sha256.txt

      - name: Publish signed production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-final-production-attestation-${{ github.sha }}
          path: candidate/
          if-no-files-found: warn
          retention-days: 90
