name: OLA FINAL PRODUCTION GATE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  final-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    timeout-minutes: 45
    steps:
      - name: Resolve target source SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert checkout is the exact release source
        shell: bash
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$TARGET_SOURCE_SHA" ]; then
            echo "::error::Release source mismatch: $checked_out != $TARGET_SOURCE_SHA"
            exit 1
          fi

      - name: Enforce exact-source security checkout contract
        run: python -m unittest discover -s tests -p "test_release_source_binding.py"

      - name: Verify required evidence gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${{ steps.target.outputs.sha }}"
          event_filter=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request|push) event_filter="&event=${GITHUB_EVENT_NAME}" ;;
          esac
          # Producer DAG gate permits up to 25 min; cover it plus queue latency.
          max_attempts=120
          sleep_seconds=15

          for attempt in $(seq 1 "$max_attempts"); do
            echo "GATE_POLL_ATTEMPT=$attempt/$max_attempts"

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${target_sha}${event_filter}&per_page=100" \
              > required-runs.json

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=100" \
              > reference-runs.json

            if python - <<'PY'
          import json
          import sys

          required_exact = [
              "Nina TDD",
              "NINA Parallel DAG Gate",
              "OLA Supply Chain Evidence Gate",
              "OLA CodeQL",
              "OLA DI-OS Product Gate",
              "NINA IGOR Ollama Full Flow",
              "OLA Decision Evidence Gate",
              "Revenue Surface Gate",
              "OLA E2E Gate",
              "Evidence Graph v0.1",
              "Real LLM Ollama Runtime Gate",
              "Provenance Mutation Gate",
              "Provenance Gate Final",
              "Nina Igor Gate",
              "Nina Real Runtime Provenance Gate (OpenAI optional)",
              "OLA State Continuity and Stability",
              "OLA Real Runtime Stress Gate",
          ]
          required_reference = [
              "OLA Frontier Baseline",
          ]

          with open("required-runs.json", encoding="utf-8") as stream:
              exact_data = json.load(stream)
          with open("reference-runs.json", encoding="utf-8") as stream:
              reference_data = json.load(stream)

          def newest_by_name(data):
              newest = {}
              for run in data.get("workflow_runs", []):
                  name = run.get("name")
                  if name and name not in newest:
                      newest[name] = {
                          "id": run.get("id"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_sha": run.get("head_sha"),
                          "event": run.get("event"),
                          "html_url": run.get("html_url"),
                      }
              return newest

          exact = newest_by_name(exact_data)
          reference = newest_by_name(reference_data)

          observed_exact = {name: exact.get(name) for name in required_exact}
          observed_reference = {name: reference.get(name) for name in required_reference}

          # The independent Ollama IGOR gate is a reusable-workflow job nested
          # inside the NINA full-flow run, not a separate workflow run. Require
          # that exact job explicitly; a skipped legacy OpenAI-only check must
          # never be mistaken for independent Ollama verification.
          nina_run = exact.get("NINA IGOR Ollama Full Flow")
          igor_gate = None
          if nina_run is not None:
              import os
              import urllib.request
              jobs_url = (
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{nina_run['id']}/jobs?per_page=100"
              )
              request = urllib.request.Request(
                  jobs_url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  jobs_data = json.load(response)
              matching_jobs = [
                  job for job in jobs_data.get("jobs", [])
                  if job.get("name") == "igor-independent-ollama / igor-ollama"
              ]
              if matching_jobs:
                  job = matching_jobs[0]
                  igor_gate = {
                      "id": job.get("id"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "html_url": job.get("html_url"),
                  }
          observed_exact["IGOR Independent Ollama Evidence Gate"] = igor_gate

          missing = [name for name, run in {**observed_exact, **observed_reference}.items() if run is None]
          pending = {
              name: run
              for name, run in {**observed_exact, **observed_reference}.items()
              if run is not None and run.get("status") != "completed"
          }
          failed = {
              name: run
              for name, run in {**observed_exact, **observed_reference}.items()
              if run is not None
              and run.get("status") == "completed"
              and run.get("conclusion") != "success"
          }

          status = {
              "exact_source_gates": observed_exact,
              "reference_gates": observed_reference,
              "missing": missing,
              "pending": pending,
              "failed": failed,
          }
          with open("gate-status.json", "w", encoding="utf-8") as stream:
              json.dump(status, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(status, indent=2, sort_keys=True))

          if failed:
              print("FAILED_REQUIRED_GATES=" + ",".join(sorted(failed)), file=sys.stderr)
              raise SystemExit(2)
          if missing or pending:
              raise SystemExit(10)
          print("ALL_REQUIRED_EVIDENCE_GATES=SUCCESS")
          PY
            then
              gate_rc=0
            else
              gate_rc=$?
            fi

            if [ "$gate_rc" -eq 0 ]; then
              break
            fi
            if [ "$gate_rc" -eq 2 ]; then
              echo "A required evidence gate completed unsuccessfully."
              exit 1
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Timed out waiting for required evidence gates."
              exit 1
            fi
            sleep "$sleep_seconds"
          done

      - name: Build release image
        run: docker build --build-arg OLA_SOURCE_COMMIT="$(git rev-parse HEAD)" -t ola-final:${{ steps.target.outputs.sha }} .

      - name: Assert release image source label
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ola-final:${TARGET_SOURCE_SHA})"
          test "$image_source" = "$TARGET_SOURCE_SHA"

      - name: Export release image
        run: docker save "ola-final:${{ steps.target.outputs.sha }}" -o ola-release-image.tar

      - name: Create source snapshot subjects
        run: |
          git archive --format=tar.gz --output=ola-source-${{ steps.target.outputs.sha }}.tar.gz "${{ steps.target.outputs.sha }}"
          sha256sum "ola-source-${{ steps.target.outputs.sha }}.tar.gz" | tee source-sha256.txt
          sha256sum ola-release-image.tar | tee image-sha256.txt

      - name: Attest source snapshot
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "ola-source-${{ steps.target.outputs.sha }}.tar.gz"

      - name: Attest release image archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ola-release-image.tar

      - name: Independently verify source and image attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "ola-source-${{ steps.target.outputs.sha }}.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify ola-release-image.tar --repo "$GITHUB_REPOSITORY"

      - name: Verify release image source-bound readiness
        shell: bash
        env:
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          pepper="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$pepper"
          docker run -d --name ola-final-gate \
            -e OLA_REQUIRE_BUILD_INFO=1 \
            -e OLA_RUNTIME_COMMIT=0000000000000000000000000000000000000000 \
            -e OLA_API_KEY_PEPPER="$pepper" \
            -p 8000:8000 "ola-final:$TARGET_SOURCE_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz | TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" python -c '
          import json, os, sys
          body=json.load(sys.stdin)
          assert body.get("core_status") == "READY", body
          assert body.get("system_acceptance") == "NOT_VERIFIED", body
          assert body.get("source_commit") == os.environ["TARGET_SOURCE_SHA"], body
          assert body.get("failed_checks") == [], body
          '; then
              echo "RELEASE_IMAGE_SOURCE_BINDING=VERIFIED"
              exit 0
            fi
            sleep 2
          done
          docker logs ola-final-gate
          exit 1

      - name: Generate final production manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="BLOCKED"
          if [ "${{ job.status }}" = "success" ]; then status="ATTESTED_PENDING_HUMAN"; fi
          cat > production-manifest.json <<EOF
          {
            "schema": "ola-production-evidence-v1",
            "commit": "${{ steps.target.outputs.sha }}",
            "source_snapshot": "ola-source-${{ steps.target.outputs.sha }}.tar.gz",
            "release_image": "ola-release-image.tar",
            "source_attestation": "verified-by-github-actions-attestation",
            "image_attestation": "verified-by-github-actions-attestation",
            "required_gates": ["ci","state-continuity","stability","provenance","signatures","real-runtime","stress","tamper","replay","human-gate"],
            "final_status": "${status}"
          }
          EOF
          sha256sum production-manifest.json | tee production-manifest-sha256.txt

      - name: Publish final production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-final-production-${{ steps.target.outputs.sha }}
          path: |
            required-runs.json
            reference-runs.json
            gate-status.json
            production-manifest.json
            production-manifest-sha256.txt
            source-sha256.txt
            image-sha256.txt
            ola-source-${{ steps.target.outputs.sha }}.tar.gz
            ola-release-image.tar

      - name: Cleanup
        if: always()
        run: docker rm -f ola-final-gate >/dev/null 2>&1 || true
