name: OLA Supply Chain Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/ola-first-five-closure-20261106]
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-scorecard-${{ github.event.pull_request.head.sha || github.sha }}
          path: scorecard-results.sarif

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: auditor
          min-severity: medium

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  security-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Build immutable local image
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg OLA_SOURCE_COMMIT="$EXPECTED_SOURCE_SHA" --tag "$IMAGE" --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          test "$image_source" = "$EXPECTED_SOURCE_SHA"

      - name: Trivy filesystem and config report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-fs-results.sarif

      - name: Trivy container report and blocking gate
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ola-sbom-${{ github.event.pull_request.head.sha || github.sha }}.spdx.json

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            trivy-fs-results.sarif
            sbom.spdx.json
          retention-days: 30


  release-attestations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout protected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert protected release source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build release image and SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          image="ola-release:$GITHUB_SHA"
          docker build --pull --build-arg OLA_SOURCE_COMMIT="$GITHUB_SHA" --tag "$image" --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          test "$image_source" = "$GITHUB_SHA"
          docker save --output ola-image.tar "$image"
          python -m pip install --disable-pip-version-check cyclonedx-bom==7.2.1
          syft "$image" -o spdx-json=sbom.spdx.json
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ola-image.tar
      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ola-image.tar
          sbom-path: sbom.spdx.json
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify ola-image.tar -R "$GITHUB_REPOSITORY" --format json > attestation-verification.json
          python - <<'PY'
          import json, sys
          data = json.load(open("attestation-verification.json", encoding="utf-8"))
          results = [
              item.get("verificationResult", {}).get("statement", {})
              for item in data
          ]
          if not results:
              sys.exit("NO_VERIFIED_ATTESTATION")
          if not any(
              item.get("_type") == "https://in-toto.io/Statement/v1"
              and item.get("predicateType") == "https://slsa.dev/provenance/v1"
              for item in results
          ):
              sys.exit("SLSA_PROVENANCE_MISSING")
          print("RELEASE_ATTESTATION=VERIFIED")
          PY
      - name: Upload release provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-release-provenance-${{ github.sha }}
          path: |
            ola-image.tar
            sbom.spdx.json
            attestation-verification.json
          retention-days: 90
