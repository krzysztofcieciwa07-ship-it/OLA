name: OLA Supply Chain Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-scorecard-${{ github.event.pull_request.head.sha || github.sha }}
          path: scorecard-results.sarif

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: auditor
          min-severity: medium

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Bootstrap Gitleaks CLI (legacy PR API scan is non-authoritative)
        id: gitleaks_bootstrap
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"
      - name: Set up Python for exact-source Gitleaks verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run Gitleaks against exact source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          LEGACY_GITLEAKS_OUTCOME: ${{ steps.gitleaks_bootstrap.outcome }}
        run: python scripts/gitleaks_exact_scan.py
      - name: Upload exact-source Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            gitleaks-exact-scan.json
            gitleaks-exact-source-results.sarif
          if-no-files-found: error
          retention-days: 14
  security-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Build immutable local image
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg OLA_SOURCE_COMMIT="$EXPECTED_SOURCE_SHA" --tag "$IMAGE" --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          if [ "$image_source" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain image source $image_source does not match $EXPECTED_SOURCE_SHA"
            exit 1
          fi
          printf '%s\n' "$image_source" > image-source-revision.txt

      - name: Trivy filesystem and config report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-fs-results.sarif

      - name: Trivy container report and blocking gate
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ola-sbom-${{ github.event.pull_request.head.sha || github.sha }}.spdx.json

      - name: Save immutable image subject
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker save --output ola-image.tar "$IMAGE"
          sha256sum ola-image.tar | tee ola-image.sha256
          sha256sum sbom.spdx.json | tee sbom.sha256

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            trivy-fs-results.sarif
            sbom.spdx.json
            ola-image.tar
            image-source-revision.txt
            ola-image.sha256
            sbom.sha256
          retention-days: 30

  attest-main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: security-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download image and SBOM subjects from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ola-supply-chain-evidence-${{ github.sha }}
          path: .

      - name: Verify exact-source image and SBOM subjects
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          IMAGE: ola-supply-chain:${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat image-source-revision.txt)" = "$EXPECTED_SOURCE_SHA"
          test "$(sha256sum ola-image.tar | awk '{print $1}')" = "$(awk '{print $1}' ola-image.sha256)"
          test "$(sha256sum sbom.spdx.json | awk '{print $1}')" = "$(awk '{print $1}' sbom.sha256)"
          docker load --input ola-image.tar
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          if [ "$image_source" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Attested image source $image_source does not match $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ola-image.tar

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ola-image.tar
          sbom-path: sbom.spdx.json

      - name: Independently verify exact-source attestation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/supply-chain-evidence.yml
          EXPECTED_WORKFLOW_REF: refs/heads/main
        run: |
          set -euo pipefail
          gh attestation verify ola-image.tar -R "$EXPECTED_REPOSITORY" --format json > attestation-verification.json
          python scripts/verify_supply_chain_attestation.py \
            --attestation attestation-verification.json \
            --subject ola-image.tar \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-workflow-path "$EXPECTED_WORKFLOW_PATH" \
            --expected-workflow-ref "$EXPECTED_WORKFLOW_REF" | tee attestation-summary.json

      - name: Upload verified attestation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-attestation-${{ github.sha }}
          path: |
            attestation-verification.json
            attestation-summary.json
          if-no-files-found: error
          retention-days: 30
