name: OLA Supply Chain Evidence Gate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-scorecard-${{ github.event.pull_request.head.sha || github.sha }}
          path: scorecard-results.sarif

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: auditor
          min-severity: medium

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  security-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Build immutable local image and assert exact source label
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg OLA_SOURCE_COMMIT="$EXPECTED_SOURCE_SHA" --tag "$IMAGE" --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          test "$image_source" = "$EXPECTED_SOURCE_SHA"

      - name: Create exact source snapshot subject
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_archive="ola-source-${EXPECTED_SOURCE_SHA}.tar.gz"
          git archive --format=tar.gz --output "$source_archive" "$EXPECTED_SOURCE_SHA"
          sha256sum "$source_archive" | tee source-snapshot-sha256.txt

      - name: Trivy filesystem and config report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-fs-results.sarif

      - name: Trivy container report and blocking gate
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ola-sbom-${{ github.event.pull_request.head.sha || github.sha }}.spdx.json

      - name: Save immutable image subject
        run: docker save --output ola-image.tar ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate SLSA provenance attestation for exact source snapshot
        if: github.event_name == 'push' && success()
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ola-source-${{ github.sha }}.tar.gz

      - name: Generate SLSA provenance attestation for image archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ola-image.tar

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ola-image.tar
          sbom-path: sbom.spdx.json

      - name: Independently verify image build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify ola-image.tar -R "$GITHUB_REPOSITORY" --format json > image-attestation-verification.json
          python - <<'PY'
          import hashlib, json, sys
          subject_sha=hashlib.sha256(open("ola-image.tar","rb").read()).hexdigest()
          data=json.load(open("image-attestation-verification.json",encoding="utf-8"))
          statements=[item.get("verificationResult",{}).get("statement",{}) for item in data]
          assert any(
              s.get("_type")=="https://in-toto.io/Statement/v1"
              and s.get("predicateType")=="https://slsa.dev/provenance/v1"
              and any(x.get("name")=="ola-image.tar" and x.get("digest",{}).get("sha256")==subject_sha for x in s.get("subject",[]))
              for s in statements
          ), "IMAGE_SLSA_SUBJECT_MISMATCH"
          print(json.dumps({"image_sha256":subject_sha,"verification":"VERIFIED"},sort_keys=True))
          PY
          echo "IMAGE_SIGSTORE=VERIFIED"
          echo "IMAGE_SLSA_PROVENANCE=VERIFIED"

      - name: Independently verify exact source snapshot provenance
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_archive="ola-source-${EXPECTED_SOURCE_SHA}.tar.gz"
          gh attestation verify "$source_archive" -R "$GITHUB_REPOSITORY" --format json > source-attestation-verification.json
          python - <<'PY'
          import hashlib, json, os, sys
          expected=os.environ["EXPECTED_SOURCE_SHA"]
          archive="ola-source-"+expected+".tar.gz"
          digest=hashlib.sha256(open(archive,"rb").read()).hexdigest()
          data=json.load(open("source-attestation-verification.json",encoding="utf-8"))
          statements=[item.get("verificationResult",{}).get("statement",{}) for item in data]
          matching=[]
          for statement in statements:
              subject_ok=(
                  statement.get("_type")=="https://in-toto.io/Statement/v1"
                  and statement.get("predicateType")=="https://slsa.dev/provenance/v1"
                  and any(x.get("name")==archive and x.get("digest",{}).get("sha256")==digest
                          for x in statement.get("subject",[]))
              )
              predicate=statement.get("predicate",{})
              dependencies=predicate.get("buildDefinition",{}).get("resolvedDependencies",[])
              source_ok=any(
                  dependency.get("digest",{}).get("gitCommit")==expected
                  for dependency in dependencies
              )
              if subject_ok and source_ok:
                  matching.append(statement)
          if not matching:
              print(json.dumps({"expected_source_sha":expected,"source_snapshot_sha256":digest,
                                "verified_statements":len(statements)},sort_keys=True))
              sys.exit("EXACT_SOURCE_SLSA_BINDING_NOT_VERIFIED")
          print(json.dumps({"expected_source_sha":expected,"source_snapshot_sha256":digest,
                            "exact_source_dependency":"VERIFIED"},sort_keys=True))
          PY
          echo "SOURCE_SIGSTORE=VERIFIED"
          echo "SOURCE_SLSA_EXACT_COMMIT=VERIFIED"

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            trivy-fs-results.sarif
            sbom.spdx.json
            ola-image.tar
            image-attestation-verification.json
            ola-source-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
            source-snapshot-sha256.txt
            source-attestation-verification.json
          retention-days: 30
