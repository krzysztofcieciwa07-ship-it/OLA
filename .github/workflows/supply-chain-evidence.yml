name: OLA Supply Chain Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/ola-first-five-closure-20261106]
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:
    inputs:
      expected_trusted_root_sha256:
        description: "Out-of-band SHA-256 of the approved Sigstore trusted root. Leave blank only for root discovery; that run is not marked verified."
        required: false
        type: string

permissions:
  contents: read

jobs:
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-scorecard-${{ github.event.pull_request.head.sha || github.sha }}
          path: scorecard-results.sarif

  provenance-adapter-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable test source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install pinned Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Run independent OCI/SLSA verifier regression tests
        run: python -m pytest -q tests/test_github_oci_provenance.py tests/test_customer_bundle_cli.py
      - name: Compile verifier and CLI modules
        run: python -m compileall -q app/customer_bundle/github_provenance.py scripts/package_github_oci_provenance.py scripts/verify_customer_bundle.py

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: auditor
          min-severity: medium

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  security-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Supply-chain scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Build immutable local image
        id: build-image
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg OLA_SOURCE_COMMIT="$EXPECTED_SOURCE_SHA" --tag "$IMAGE" --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          test "$image_source" = "$EXPECTED_SOURCE_SHA"

      - name: Inspect Python package metadata paths in built image
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for root in /usr/local/lib/python3.13 /opt/venv/lib/python3.13; do
              [ -d "$root" ] || continue
              find "$root" -type f \
                \( -path "*/msgpack*dist-info/METADATA" -o -path "*/setuptools*dist-info/METADATA" -o -path "*/urllib3*dist-info/METADATA" \\) \
                -exec sh -c '\''for f do printf "%s " "$f"; grep -m1 "^Version:" "$f" || true; done'\'' sh {} +
            done
          '

      - name: Run built image and verify health
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="ola-pr-runtime-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          expected_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:18080:8000 \
            --env OLA_API_KEY_PEPPER="$EXPECTED_SOURCE_SHA" \
            --env OLA_RUNTIME_COMMIT="$EXPECTED_SOURCE_SHA" \
            "$IMAGE" >/dev/null
          actual_image_id="$(docker inspect --format '{{.Image}}' "$container_name")"
          test "$actual_image_id" = "$expected_image_id"
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            docker logs "$container_name"
            exit 1
          fi
          printf 'RUNTIME_SMOKE=HEALTHY\\nIMAGE_ID=%s\n' "$actual_image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy filesystem and config report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: false

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-fs-results.sarif

      - name: Trivy container report and blocking gate
        env:
          IMAGE: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          skip-setup-trivy: true

      - name: Generate SPDX SBOM
        if: always() && steps.build-image.outcome == 'success'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ola-supply-chain:${{ github.event.pull_request.head.sha || github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ola-sbom-${{ github.event.pull_request.head.sha || github.sha }}.spdx.json

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-supply-chain-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            trivy-fs-results.sarif
            sbom.spdx.json
          retention-days: 30


  oci-slsa-attestations:
    needs: [security-image, provenance-adapter-tests]
    env:
      EXPECTED_TRUST_ROOT_SHA256: ${{ inputs.expected_trusted_root_sha256 || vars.OLA_SIGSTORE_TRUST_ROOT_SHA256 }}
    # A trusted main release creates production-eligible evidence. Manual
    # dispatch on a feature branch is a non-production rehearsal only.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/oidc-human-gate-customer-bundle-20261107')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/feat/oidc-human-gate-customer-bundle-20261107"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi

      - name: Prepare immutable OCI image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/$repository_lc"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build exact local OCI image
        id: build-image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --pull --load \
            --build-arg OLA_SOURCE_COMMIT="$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --file Dockerfile .
          image_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME:$GITHUB_SHA")"
          test "$image_source" = "$GITHUB_SHA"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:$GITHUB_SHA")"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Trivy scan exact image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false

      - name: Generate SPDX SBOM for exact image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ola-release-sbom-${{ github.sha }}.spdx.json

      - name: Push exact scanned OCI image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          repo_digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE_NAME:$GITHUB_SHA")"
          case "$repo_digest" in "$IMAGE_NAME@sha256:"*) ;; *) echo "::error::OCI registry digest missing"; exit 1;; esac
          digest="${repo_digest##*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'OCI_IMAGE=%s@%s\n' "$IMAGE_NAME" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify registry digest against running container imageID
        id: runtime-image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build-image.outputs.image_id }}
          OCI_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$OCI_DIGEST"
          pulled_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME@$OCI_DIGEST")"
          test "$pulled_image_id" = "$EXPECTED_IMAGE_ID"

          container_name="ola-oci-runtime-proof-$GITHUB_RUN_ID"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:18080:8000 \
            --env OLA_API_KEY_PEPPER="$GITHUB_SHA" \
            --env OLA_RUNTIME_COMMIT="$GITHUB_SHA" \
            "$IMAGE_NAME@$OCI_DIGEST" >/dev/null

          container_id="$(docker inspect --format '{{.Id}}' "$container_name")"
          container_image_id="$(docker inspect --format '{{.Image}}' "$container_name")"
          container_started_at="$(docker inspect --format '{{.State.StartedAt}}' "$container_name")"
          test "$container_image_id" = "$EXPECTED_IMAGE_ID"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true

          SOURCE_SHA="$GITHUB_SHA" IMAGE_NAME="$IMAGE_NAME" OCI_DIGEST="$OCI_DIGEST" \
            IMAGE_ID="$container_image_id" CONTAINER_ID="$container_id" \
            STARTED_AT="$container_started_at" python - <<'PY'
          import json, os
          proof = {
              "schema": "ola-runtime-image-proof/v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "image_name": os.environ["IMAGE_NAME"],
              "image_digest": os.environ["OCI_DIGEST"],
              "image_id": os.environ["IMAGE_ID"],
              "container_id": os.environ["CONTAINER_ID"],
              "container_started_at": os.environ["STARTED_AT"],
              "health": "healthy",
          }
          with open("runtime-image-proof.json", "w", encoding="utf-8") as handle:
              json.dump(proof, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY
          printf 'RUNTIME_IMAGE_PROOF=VERIFIED\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'OCI_DIGEST=%s\nIMAGE_ID=%s\n' "$OCI_DIGEST" "$container_image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate OCI SLSA provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate OCI SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Export Sigstore trusted root
        shell: bash
        run: |
          set -euo pipefail
          gh attestation trusted-root > trusted_root.jsonl
          test -s trusted_root.jsonl

      - name: Require configured trust-root pin for main releases
        if: github.event_name == 'push' && env.EXPECTED_TRUST_ROOT_SHA256 == ''
        shell: bash
        run: |
          echo "::error::OLA_SIGSTORE_TRUST_ROOT_SHA256 is required for main-branch attestation"
          exit 1

      - name: Record Sigstore trust-root discovery pin (not yet approved)
        if: github.event_name == 'workflow_dispatch' && env.EXPECTED_TRUST_ROOT_SHA256 == ''
        shell: bash
        run: |
          set -euo pipefail
          sha256sum trusted_root.jsonl | awk '{print $1}' > trusted_root.sha256
          printf 'ROOT_PIN_STATUS=PENDING_EXTERNAL_APPROVAL\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'TRUSTED_ROOT_SHA256=%s\n' "$(cat trusted_root.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and package exact OCI provenance bundle with external root pin
        if: env.EXPECTED_TRUST_ROOT_SHA256 != ''
        shell: bash
        env:
          OCI_IMAGE_NAME: ${{ steps.image.outputs.name }}
          OCI_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          [[ "$EXPECTED_TRUST_ROOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/supply-chain-evidence.yml@$GITHUB_REF"
          python scripts/package_github_oci_provenance.py \
            --bundle "$PROVENANCE_BUNDLE" \
            --trusted-root trusted_root.jsonl \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-identity "$workflow_identity" \
            --image-name "$OCI_IMAGE_NAME" \
            --image-digest "$OCI_IMAGE_DIGEST" \
            --expected-trusted-root-sha256 "$EXPECTED_TRUST_ROOT_SHA256" \
            --output source-runtime.json

      - name: Upload verified OCI provenance evidence
        if: env.EXPECTED_TRUST_ROOT_SHA256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-oci-slsa-evidence-${{ github.sha }}
          path: |
            source-runtime.json
            runtime-image-proof.json
            sbom.spdx.json
            trusted_root.jsonl
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom-attestation.outputs.bundle-path }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload Sigstore root discovery materials (unverified)
        if: github.event_name == 'workflow_dispatch' && env.EXPECTED_TRUST_ROOT_SHA256 == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-sigstore-root-discovery-${{ github.sha }}
          path: |
            trusted_root.jsonl
            trusted_root.sha256
            runtime-image-proof.json
            sbom.spdx.json
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom-attestation.outputs.bundle-path }}
          retention-days: 30
          if-no-files-found: error
