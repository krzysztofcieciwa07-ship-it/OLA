name: OLA Real Runtime Stress Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build runtime image
        run: |
          set -euo pipefail
          docker build --build-arg OLA_SOURCE_COMMIT="${GITHUB_SHA}" -t ola-stress .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ola-stress)" = "${GITHUB_SHA}"
      - name: Start runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ola-stress -p 8000:8000 -e OLA_RUNTIME_COMMIT="$GITHUB_SHA" ola-stress
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          docker exec -e EXPECTED_SOURCE_SHA="$GITHUB_SHA" ola-stress python -c 'import json,os; d=json.load(open("/app/ola-build-info.json")); assert d["source_commit"] == os.environ["EXPECTED_SOURCE_SHA"], d'
      - name: Run concurrent SLI load
        run: |
          python scripts/stress_runtime.py | tee stress-summary.log
      - name: Capture runtime evidence
        if: always()
        run: docker logs ola-stress > runtime-stress.log 2>&1 || true
      - name: Publish stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-runtime-stress-${{ github.sha }}
          path: |
            stress-evidence.json
            stress-summary.log
            runtime-stress.log
      - name: Stop runtime
        if: always()
        run: docker rm -f ola-stress >/dev/null 2>&1 || true
