name: OLA Isolated Staging Rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLA_STAGING_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable candidate without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm tested source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Python runtime for local control
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run actual SQLite persistence, append-only and restart checks
        run: |
          set -euo pipefail
          docker compose version
          python scripts/staging_rehearsal.py

      - name: Upload synthetic result (never credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ola-staging-rehearsal
          path: staging-evidence.json
          if-no-files-found: warn
          retention-days: 14
