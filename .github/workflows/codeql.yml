name: OLA CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert scan checkout matches immutable source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::CodeQL scanned $checked_out instead of $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/${{ matrix.language }}"
          output: codeql-results

      - name: Test security policy with high rule metadata
        run: python -m unittest discover -s tests -p "test_codeql_sarif_gate.py"

      - name: Enforce OLA high/critical policy from SARIF
        run: python scripts/check_codeql_sarif.py codeql-results

      - name: Inspect GitHub Advanced Security alerts for exact PR source (read-only)
        if: ${{ matrix.language == 'python' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          ref = f'refs/pull/{os.environ["PR_NUMBER"]}/head'
          url = f"https://api.github.com/repos/{repo}/code-scanning/alerts?ref={quote(ref, safe='')}&state=open&per_page=100"
          req = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(req, timeout=20) as response:
                  alerts = json.load(response)
          except Exception as error:
              print(json.dumps({"status": "BLOCK", "reason": "CODE_SCANNING_ALERT_READ_FAILED",
                                "error_class": type(error).__name__}))
              sys.exit(1)
          if not isinstance(alerts, list) or len(alerts) >= 100:
              print(json.dumps({"status": "BLOCK", "reason": "ALERT_LIST_INCOMPLETE"}))
              sys.exit(1)
          # Evaluate alerts against added/modified lines, not whole files:
          # an existing alert elsewhere in a touched file is not PR-introduced.
          files_url = f"https://api.github.com/repos/{repo}/pulls/{os.environ['PR_NUMBER']}/files?per_page=100"
          files_req = Request(files_url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(files_req, timeout=20) as response:
                  changed_files = json.load(response)
          except Exception as error:
              print(json.dumps({"status": "BLOCK", "reason": "PR_CHANGED_FILES_READ_FAILED",
                                "error_class": type(error).__name__}))
              sys.exit(1)
          if not isinstance(changed_files, list) or len(changed_files) >= 100:
              print(json.dumps({"status": "BLOCK", "reason": "PR_CHANGED_FILES_INCOMPLETE"}))
              sys.exit(1)

          changed_lines_by_path = {}
          for item in changed_files:
              path = item.get("filename")
              if not path:
                  continue
              patch = item.get("patch")
              if not isinstance(patch, str):
                  # Missing/truncated diffs are not silently treated as clean.
                  changed_lines_by_path[path] = None
                  continue
              changed_lines = set()
              new_line = None
              for patch_line in patch.splitlines():
                  if patch_line.startswith("@@"):
                      match = re.search(r"\+(\d+)(?:,\d+)?", patch_line)
                      new_line = int(match.group(1)) if match else None
                  elif patch_line.startswith(("+++", "---")):
                      continue
                  elif new_line is not None and patch_line.startswith("+"):
                      changed_lines.add(new_line)
                      new_line += 1
                  elif new_line is not None and patch_line.startswith("-"):
                      continue
                  elif new_line is not None and patch_line.startswith(" "):
                      new_line += 1
              changed_lines_by_path[path] = changed_lines

          relevant = []
          for alert in alerts:
              inst = alert.get("most_recent_instance") or {}
              rule = alert.get("rule") or {}
              if (alert.get("tool") or {}).get("name") != "CodeQL":
                  continue
              relevant.append({
                  "number": alert.get("number"), "severity": rule.get("security_severity_level") or rule.get("severity"),
                  "rule": rule.get("id"), "sha": inst.get("commit_sha"),
                  "path": (inst.get("location") or {}).get("path"),
                  "line": (inst.get("location") or {}).get("start_line"),
                  "url": alert.get("html_url"),
              })
          current = []
          for alert in relevant:
              if alert["sha"] != expected or alert["path"] not in changed_lines_by_path:
                  continue
              changed_lines = changed_lines_by_path[alert["path"]]
              if changed_lines is None:
                  alert["diff_status"] = "PATCH_UNAVAILABLE"
                  current.append(alert)
              elif alert["line"] is None or alert["line"] in changed_lines:
                  alert["diff_status"] = "CHANGED_LINE"
                  current.append(alert)
          high = [a for a in current if a["severity"] in ("critical", "high")]
          print(json.dumps({
              "status": "BLOCK" if high else "INSPECTED",
              "expected_sha": expected,
              "changed_lines_by_path": {
                  path: None if lines is None else sorted(lines)
                  for path, lines in sorted(changed_lines_by_path.items())
              },
              "in_scope_alerts": current,
              "repository_alert_inventory": relevant,
          }, sort_keys=True))
          if high:
              sys.exit(1)
          PY
