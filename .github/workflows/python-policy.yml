name: Python Dependency Policy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Detect Python dependency manifests
        id: detect
        shell: bash
        run: |
          if [[ -f requirements.txt || -f pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install .
          fi

      - name: Install pinned policy scanners
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install "pip-licenses==5.5.5" "pip-audit==2.10.1"

      - name: Block GPL/AGPL dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          pip-licenses --partial-match --fail-on="GPL;AGPL"

      - name: Generate Python dependency license notice
        if: steps.detect.outputs.present == 'true'
        run: |
          pip-licenses --format=json > python-dependency-licenses.json
          python -m pip list --format=json > python-installed-packages.json

      - name: Audit known Python vulnerabilities
        if: steps.detect.outputs.present == 'true'
        run: |
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt
          else
            pip-audit .
          fi

      - name: Upload Python dependency evidence
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-policy
          path: |
            python-dependency-licenses.json
            python-installed-packages.json
          if-no-files-found: error

      - name: Explicit zero-Python-dependency status
        if: steps.detect.outputs.present == 'false'
        run: echo "PYTHON_DEPENDENCY_POLICY=NO_MANIFESTS_PRESENT"
