name: Human Gate — GitHub Approval Enforcement

on:
  pull_request_target:
    branches:
      - main
      - "security/**"
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: human-gate-\${{ github.event.pull_request.number || github.event.review.pull_request_url || github.run_id }}
  cancel-in-progress: true

jobs:
  approval-policy:
    name: human-gate-approval
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base-branch policy only
        if: \${{ github.event_name != 'push' }}
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record main push as post-merge audit only
        if: \${{ github.event_name == 'push' }}
        run: echo "POST_MERGE_AUDIT_ONLY — this run is not an approval and cannot authorize an operation."

      - name: Evaluate Human Gate policy on exact HEAD
        if: \${{ github.event_name != 'push' }}
        uses: actions/github-script@v7
        env:
          HUMAN_GATE_GOVERNANCE_TOKEN: \${{ secrets.HUMAN_GATE_GOVERNANCE_TOKEN }}
        with:
          script: |
            const policy = require("./.github/scripts/human-gate-policy.cjs");
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.setFailed("BLOCKED: review event did not contain a pull request payload");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const labelsResponse = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const labels = labelsResponse.data.map((x) => x.name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100
            });

            if (!policy.isHighRisk(labels, files.map((f) => f.filename))) {
              core.notice("NOT_APPLICABLE: PR is not marked or scoped as a Human Gate task.");
              return;
            }

            const input = {
              pullRequest: {
                state: pr.state,
                draft: pr.draft,
                body: pr.body || "",
                user: { login: pr.user.login },
                head: { sha: pr.head.sha },
              },
              pullRequestLabels: labels,
              files,
            };

            const taskIssueNumber = policy.extractTaskIssue(pr.body || "");
            if (!taskIssueNumber) {
              core.setFailed("BLOCKED: add exactly one Human Gate Task: #<issue> reference to the PR body.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: taskIssueNumber });
            input.issues = {
              [taskIssueNumber]: {
                state: issue.state,
                labels: issue.labels.map((x) => typeof x === "string" ? x : x.name),
              },
            };

            const { data: codeownersFile } = await github.rest.repos.getContent({
              owner, repo, path: ".github/CODEOWNERS", ref: pr.base.ref
            });
            if (Array.isArray(codeownersFile) || codeownersFile.encoding !== "base64") {
              core.setFailed("BLOCKED: trusted base-branch CODEOWNERS file is unavailable.");
              return;
            }
            input.codeowners = Buffer.from(codeownersFile.content, "base64").toString("utf8");

            input.reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100
            });

            const rules = policy.parseCodeowners(input.codeowners);
            const candidateUsers = new Set();
            for (const file of files) {
              for (const login of policy.ownersForPath(file.filename, rules)) candidateUsers.add(login);
            }

            const author = String(pr.user.login).toLowerCase();
            for (const file of files) {
              const owners = policy.ownersForPath(file.filename, rules);
              if (![...owners].some((login) => login !== author)) {
                core.setFailed("BLOCKED: no independent CODEOWNER covers " + file.filename);
                return;
              }
            }

            const governanceToken = process.env.HUMAN_GATE_GOVERNANCE_TOKEN;
            if (!governanceToken) {
              core.setFailed("BLOCKED: HUMAN_GATE_GOVERNANCE_TOKEN is not configured. It must be read-only and allow collaborator-permission verification (Administration:read).");
              return;
            }
            const { Octokit } = require("@octokit/rest");
            const governanceApi = new Octokit({ auth: governanceToken });
            input.permissions = {};
            for (const login of candidateUsers) {
              try {
                const { data } = await governanceApi.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: login
                });
                input.permissions[login] = data.permission;
              } catch (error) {
                input.permissions[login] = "none";
                core.warning("Permission lookup failed for CODEOWNER " + login + "; treated as none (fail-closed).");
              }
            }

            input.reviewThreads = [];
            let cursor = null;
            do {
              const query = [
                "query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {",
                "  repository(owner: $owner, name: $repo) {",
                "    pullRequest(number: $number) {",
                "      reviewThreads(first: 100, after: $cursor) {",
                "        nodes { isResolved }",
                "        pageInfo { hasNextPage endCursor }",
                "      }",
                "    }",
                "  }",
                "}"
              ].join("\n");
              const result = await github.graphql(query, { owner, repo, number: prNumber, cursor });
              const connection = result.repository.pullRequest.reviewThreads;
              input.reviewThreads.push(...connection.nodes);
              cursor = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
            } while (cursor);

            const result = policy.evaluateHumanGate(input);
            core.notice(JSON.stringify(result));
            if (result.status !== "APPROVED" && result.status !== "NOT_APPLICABLE") {
              core.setFailed("HUMAN_GATE_BLOCKED: " + result.reason);
              return;
            }
            if (result.status === "APPROVED") {
              core.notice("HUMAN_GATE_APPROVED: task #" + result.taskIssueNumber + ", exact SHA " + result.headSha);
            }