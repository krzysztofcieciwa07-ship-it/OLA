name: Human Gate — GitHub Approval Enforcement

on:
  # zizmor: ignore[dangerous-triggers] — trusted policy only: checks out main, never checks out or executes PR code, uses read-only GITHUB_TOKEN.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: human-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.review.pull_request_url || github.run_id }}
  cancel-in-progress: true

jobs:
  approval-policy:
    name: human-gate-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: human-gate-governance
    steps:
      - name: Check out trusted default-branch policy only
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate Human Gate policy for task Issues and PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HUMAN_GATE_GOVERNANCE_TOKEN: ${{ secrets.HUMAN_GATE_GOVERNANCE_TOKEN }}
        with:
          script: |
            const policy = require("./.github/scripts/human-gate-policy.cjs");
            const { owner, repo } = context.repo;

            async function evaluatePR(prNumber, expectedIssueNumber = null) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (!pr.head.repo || pr.head.repo.full_name !== owner + "/" + repo) {
                return { status: "BLOCKED", reason: "HUMAN_GATE_REQUIRES_INTERNAL_REVIEW_BRANCH", prNumber };
              }
              if (expectedIssueNumber && policy.extractTaskIssue(pr.body || "") !== expectedIssueNumber) {
                return { status: "BLOCKED", reason: "PR_TASK_ID_DOES_NOT_MATCH_ISSUE", prNumber };
              }

              const labelResponse = await github.rest.issues.listLabelsOnIssue({
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const labels = labelResponse.data.map((x) => x.name);
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              if (!policy.isHighRisk(labels, files.map((f) => f.filename))) {
                return { status: "NOT_APPLICABLE", prNumber };
              }

              const taskIssueNumber = expectedIssueNumber || policy.extractTaskIssue(pr.body || "");
              if (!taskIssueNumber) {
                return { status: "BLOCKED", reason: "HUMAN_GATE_TASK_ISSUE_REFERENCE_MISSING", prNumber };
              }
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: taskIssueNumber });

              const input = {
                pullRequest: {
                  state: pr.state,
                  draft: pr.draft,
                  body: pr.body || "",
                  user: { login: pr.user.login },
                  head: { sha: pr.head.sha },
                },
                pullRequestLabels: labels,
                files,
                issues: {
                  [taskIssueNumber]: {
                    state: issue.state,
                    labels: issue.labels.map((x) => typeof x === "string" ? x : x.name),
                  },
                },
              };

              const { data: codeownersFile } = await github.rest.repos.getContent({
                owner, repo, path: ".github/CODEOWNERS", ref: "main"
              });
              if (Array.isArray(codeownersFile) || codeownersFile.encoding !== "base64") {
                return { status: "BLOCKED", reason: "TRUSTED_MAIN_CODEOWNERS_UNAVAILABLE", prNumber };
              }
              input.codeowners = Buffer.from(codeownersFile.content, "base64").toString("utf8");
              input.reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100
              });

              const rules = policy.parseCodeowners(input.codeowners);
              const candidateUsers = new Set();
              for (const file of files) {
                const ownersForFile = policy.ownersForPath(file.filename, rules);
                const author = String(pr.user.login).toLowerCase();
                if (![...ownersForFile].some((login) => login !== author)) {
                  return {
                    status: "BLOCKED",
                    reason: "NO_INDEPENDENT_CODEOWNER_FOR_PATH",
                    path: file.filename,
                    prNumber,
                    taskIssueNumber,
                  };
                }
                for (const login of ownersForFile) candidateUsers.add(login);
              }

              const governanceToken = process.env.HUMAN_GATE_GOVERNANCE_TOKEN;
              if (!governanceToken) {
                return {
                  status: "BLOCKED",
                  reason: "HUMAN_GATE_GOVERNANCE_TOKEN_MISSING",
                  detail: "Configure a read-only fine-grained token with Administration:read in the human-gate-governance environment; token values are never logged.",
                  prNumber,
                  taskIssueNumber,
                };
              }
              const { Octokit } = require("@octokit/rest");
              const governanceApi = new Octokit({ auth: governanceToken });

              input.permissions = {};
              for (const login of candidateUsers) {
                try {
                  const { data } = await governanceApi.rest.repos.getCollaboratorPermissionLevel({
                    owner, repo, username: login
                  });
                  input.permissions[login] = data.permission;
                } catch (error) {
                  input.permissions[login] = "none";
                  core.warning("CODEOWNER permission lookup failed for " + login + "; treated as none (fail-closed).");
                }
              }

              input.reviewThreads = [];
              let cursor = null;
              do {
                const query = [
                  "query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {",
                  "  repository(owner: $owner, name: $repo) {",
                  "    pullRequest(number: $number) {",
                  "      reviewThreads(first: 100, after: $cursor) {",
                  "        nodes { isResolved }",
                  "        pageInfo { hasNextPage endCursor }",
                  "      }",
                  "    }",
                  "  }",
                  "}"
                ].join("\n");
                const result = await github.graphql(query, { owner, repo, number: prNumber, cursor });
                const connection = result.repository.pullRequest.reviewThreads;
                input.reviewThreads.push(...connection.nodes);
                cursor = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
              } while (cursor);

              return policy.evaluateHumanGate(input);
            }

            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              const labels = (issue.labels || []).map((x) => typeof x === "string" ? x : x.name);
              if (!policy.isHighRisk(labels, [])) {
                core.notice("NOT_APPLICABLE: Issue is not marked P0/P1/security/Human Gate.");
                return;
              }
              const openPRs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100
              });
              const linked = openPRs.filter((pr) => policy.extractTaskIssue(pr.body || "") === issue.number);
              if (linked.length === 0) {
                core.setFailed("HUMAN_GATE_BLOCKED: high-risk Issue #" + issue.number + " has no linked open PR.");
                return;
              }
              const results = [];
              for (const pr of linked) {
                const result = await evaluatePR(pr.number, issue.number);
                results.push({ pr: pr.number, ...result });
              }
              core.notice(JSON.stringify({ issue: issue.number, linkedPRs: results }));
              const blocked = results.filter((x) => x.status !== "APPROVED");
              if (blocked.length > 0) {
                core.setFailed("HUMAN_GATE_BLOCKED: one or more linked PRs lack current independent approval.");
              }
              return;
            }

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.setFailed("BLOCKED: event did not contain a pull request payload.");
              return;
            }
            const result = await evaluatePR(prNumber);
            core.notice(JSON.stringify(result));
            if (result.status !== "APPROVED" && result.status !== "NOT_APPLICABLE") {
              core.setFailed("HUMAN_GATE_BLOCKED: " + result.reason);
            }