name: OLA E2E Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest E2E
        run: python -m pytest -q

      - name: Run independent README guarantee gate
        run: python scripts/verify_readme_claims.py

      - name: Build deployment image
        run: docker build --tag ola:${GITHUB_SHA} .

      - name: Run deployment image
        run: |
          docker run --detach --rm --name ola-e2e --publish 8000:8000 ola:${GITHUB_SHA}
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ola-e2e
          exit 1

      - name: Stop deployment image
        if: always()
        run: docker stop ola-e2e || true
