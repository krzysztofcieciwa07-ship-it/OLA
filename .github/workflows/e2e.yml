name: OLA E2E Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest E2E
        run: python -m pytest -q

      - name: Run independent README guarantee gate
        run: python scripts/verify_readme_claims.py

      - name: Build deployment image
        run: docker build --tag ola:${GITHUB_SHA} .

      - name: Run deployment image
        run: |
          docker run --detach --rm --name ola-e2e --publish 8000:8000 -e STRIPE_WEBHOOK_SECRET="whsec_ci_ola" -e OLA_STRIPE_TENANT_ID="00000000-0000-0000-0000-000000000001" ola:${GITHUB_SHA}
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ola-e2e
          exit 1

      - name: Independent runtime E2E proof
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker exec -i -e EXPECTED_COMMIT="$EXPECTED_COMMIT" ola-e2e python - <<'PY'
          import hashlib, json, os, sqlite3, urllib.request, uuid
          db_path = "/data/ola.db"
          tenant_id = str(uuid.uuid4())
          raw_key = "ci-runtime-key"
          key_hash = hashlib.sha256(raw_key.encode()).hexdigest()
          db = sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id, name) VALUES (?, ?)", (tenant_id, "ci-runtime"))
          db.execute("INSERT INTO api_keys(id, tenant_id, key_hash) VALUES (?, ?, ?)", (str(uuid.uuid4()), tenant_id, key_hash))
          db.commit(); db.close()
          def post_audit():
              req = urllib.request.Request("http://127.0.0.1:8000/audit", data=json.dumps({"task":"runtime E2E proof","scenario":"fault_then_recovery"}).encode(), headers={"Content-Type":"application/json","X-API-Key":raw_key}, method="POST")
              with urllib.request.urlopen(req, timeout=10) as response: return json.load(response)
          result = post_audit()
          assert result["status"] == "VERIFIED", result
          assert result["outcome"] == "recovered_and_verified", result
          assert result["evidence_count"] == 5, result
          db = sqlite3.connect(db_path)
          rows = db.execute("SELECT id, tenant_id, seq, record_type, payload_json, prev_hash, record_hash FROM evidence_records WHERE tenant_id=? ORDER BY seq", (tenant_id,)).fetchall(); db.close()
          expected_types = ["task.received","execution.started","fault.detected","recovery.applied","verification.passed"]
          assert [r[3] for r in rows] == expected_types, rows
          assert [r[0] for r in rows] == result["evidence_ids"], (rows, result)
          expected_prev = "0" * 64
          for expected_seq, row in enumerate(rows):
              _, row_tenant, seq, _, payload_json, prev_hash, record_hash = row
              assert row_tenant == tenant_id; assert seq == expected_seq; assert prev_hash == expected_prev
              expected_hash = hashlib.sha256(f"{tenant_id}|{seq}|{prev_hash}|{payload_json}".encode("utf-8")).hexdigest()
              assert record_hash == expected_hash, (seq, record_hash, expected_hash); expected_prev = record_hash
          print(json.dumps({"gate":"INDEPENDENT_RUNTIME_E2E","status":"VERIFIED","container_health":"PASS","http_audit":"PASS","evidence_count":len(rows),"hash_chain":"PASS","result_ids_match_db":True,"commit":os.environ["EXPECTED_COMMIT"]}, sort_keys=True))
          PY

      - name: Real task six-agent E2E and independent final-result verification
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_TASK: Calculate 17 * 23 and return the verified result.
          EXPECTED_RESULT: "391"
        run: |
          set -euo pipefail
          docker exec -i -e EXPECTED_COMMIT="$EXPECTED_COMMIT" -e EXPECTED_TASK="$EXPECTED_TASK" -e EXPECTED_RESULT="$EXPECTED_RESULT" ola-e2e python - <<'PY' > agent-runtime-proof.json
          import hashlib, json, os, sqlite3, subprocess, urllib.request, uuid
          db_path = "/data/ola.db"
          tenant_id = str(uuid.uuid4())
          raw_key = "ci-agent-key"
          key_hash = hashlib.sha256(raw_key.encode()).hexdigest()
          db = sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id, name) VALUES (?, ?)", (tenant_id, "ci-real-task"))
          db.execute("INSERT INTO api_keys(id, tenant_id, key_hash) VALUES (?, ?, ?)", (str(uuid.uuid4()), tenant_id, key_hash))
          db.commit(); db.close()
          task = os.environ["EXPECTED_TASK"]
          expected_result = os.environ["EXPECTED_RESULT"]
          req = urllib.request.Request("http://127.0.0.1:8000/agent-run", data=json.dumps({"task":task}).encode(), headers={"Content-Type":"application/json","X-API-Key":raw_key}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response: result = json.load(response)
          assert result["status"] == "VERIFIED", result
          assert result["task"] == task, result
          assert result["final_result"] == expected_result, result
          assert result["evidence_count"] == 6, result
          assert result["agents"] == ["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"], result
          assert result["execution"][0]["tool_output"] == expected_result, result
          assert result["execution"][-1]["final_result"] == expected_result, result
          db = sqlite3.connect(db_path)
          rows = db.execute("SELECT id, tenant_id, seq, record_type, payload_json, prev_hash, record_hash FROM evidence_records WHERE tenant_id=? ORDER BY seq", (tenant_id,)).fetchall(); db.close()
          assert [r[0] for r in rows] == result["evidence_ids"], (rows, result)
          assert [r[3] for r in rows] == ["agent.codeact","agent.react","agent.agentic_rag","agent.mcp_tool_use","agent.self_reflection","agent.multi_agent"], rows
          payloads = [json.loads(r[4]) for r in rows]
          assert all(p["task"] == task for p in payloads), payloads
          assert payloads[0]["tool_output"] == expected_result, payloads[0]
          assert payloads[-1]["final_result"] == expected_result, payloads[-1]
          expected_prev = "0" * 64
          for expected_seq, row in enumerate(rows):
              _, row_tenant, seq, _, payload_json, prev_hash, record_hash = row
              assert row_tenant == tenant_id; assert seq == expected_seq; assert prev_hash == expected_prev
              expected_hash = hashlib.sha256(f"{tenant_id}|{seq}|{prev_hash}|{payload_json}".encode("utf-8")).hexdigest()
              assert record_hash == expected_hash; expected_prev = record_hash
          verifier = subprocess.run(
              ["python", "scripts/verify_agent_runtime.py", "--tenant-id", tenant_id,
               "--run-id", result["run_id"], "--expected-commit", os.environ["EXPECTED_COMMIT"],
               "--expected-task", task, "--expected-result", expected_result],
              capture_output=True, text=True,
          )
          print(verifier.stdout)
          if verifier.returncode != 0:
              print("STDERR:", verifier.stderr, file=__import__("sys").stderr)
              raise RuntimeError(f"Independent final-result verification failed with exit code {verifier.returncode}")
          PY
          cat agent-runtime-proof.json

      - name: Controlled invoice six-agent business E2E and independent verifier
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          INVOICE_JSON: '{"invoice_id":"INV-CI-2026-001","supplier":"TEST-SUPPLIER","currency":"EUR","net":1000.0,"vat_rate":0.21}'
        run: |
          set -euo pipefail
          docker exec -i -e EXPECTED_COMMIT="$EXPECTED_COMMIT" -e INVOICE_JSON="$INVOICE_JSON" ola-e2e python - <<'PY' > business-invoice-proof.json
          import json, os, sqlite3, subprocess, sys, urllib.request, uuid
          db_path = "/data/ola.db"
          invoice = json.loads(os.environ["INVOICE_JSON"])
          raw_key = "ci-business-key"
          tenant_id = str(uuid.uuid4())
          import hashlib
          key_hash = hashlib.sha256(raw_key.encode()).hexdigest()
          db = sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id, name) VALUES (?, ?)", (tenant_id, "ci-business-invoice"))
          db.execute("INSERT INTO api_keys(id, tenant_id, key_hash) VALUES (?, ?, ?)", (str(uuid.uuid4()), tenant_id, key_hash))
          db.commit(); db.close()
          req = urllib.request.Request("http://127.0.0.1:8000/business-invoice-run", data=json.dumps({"invoice": invoice}, sort_keys=True).encode(), headers={"Content-Type":"application/json","X-API-Key":raw_key}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response: result = json.load(response)
          assert result["status"] == "VERIFIED", result
          assert result["agents"] == ["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"], result
          assert result["evidence_count"] == 6, result
          final = result["final_result"]
          assert final["invoice_id"] == invoice["invoice_id"], final
          assert final["net"] == 1000.0 and final["vat"] == 210.0 and final["gross"] == 1210.0, final
          assert final["payment_decision"] == "APPROVE_FOR_TEST_TRANSFER", final
          assert final["transfer_amount"] == 1210.0, final
          assert final["transfer_status"] == "READY_NOT_SENT", final
          verifier = subprocess.run(["python", "scripts/verify_business_invoice.py", "--db", db_path, "--tenant-id", tenant_id, "--run-id", result["run_id"], "--invoice-json", json.dumps(invoice, sort_keys=True, separators=(",", ":"))], capture_output=True, text=True)
          print(verifier.stdout)
          if verifier.returncode != 0:
              print("STDERR:", verifier.stderr, file=sys.stderr)
              raise RuntimeError(f"Independent business verifier failed with exit code {verifier.returncode}")
          PY
          cat business-invoice-proof.json

      - name: Stripe confirmed-payment webhook triggers OLA and is idempotent
        run: |
          set -euo pipefail
          docker exec -i ola-e2e python - <<'PY'
          import hashlib, hmac, json, os, sqlite3, time, urllib.error, urllib.request, uuid

          db_path="/data/ola.db"
          tenant_id="00000000-0000-0000-0000-000000000001"
          raw_key="stripe-webhook-ci-key"
          db=sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id,name) VALUES (?,?)",(tenant_id,"ci-stripe-webhook"))
          db.execute("INSERT INTO api_keys(id,tenant_id,key_hash) VALUES (?,?,?)",(str(uuid.uuid4()),tenant_id,hashlib.sha256(raw_key.encode()).hexdigest()))
          db.commit(); db.close()

          payload={
              "id":"evt_ci_ola_checkout_001",
              "type":"checkout.session.completed",
              "data":{"object":{
                  "id":"cs_ci_ola_checkout_001",
                  "metadata":{"offer":"ola-execution-audit"},
                  "payment_status":"paid",
                  "amount_total":9900,
                  "currency":"eur",
                  "custom_fields":[{"key":"audit_task","type":"text","text":{"value":"Calculate 17 * 23 and return the verified result."}}]
              }}
          }
          body=json.dumps(payload,separators=(",",":"),sort_keys=True).encode()
          timestamp=int(time.time())
          digest=hmac.new(b"whsec_ci_ola",f"{timestamp}.".encode()+body,hashlib.sha256).hexdigest()
          signature=f"t={timestamp},v1={digest}"

          def post():
              req=urllib.request.Request(
                  "http://127.0.0.1:8000/stripe/webhook",
                  data=body,
                  headers={"Content-Type":"application/json","Stripe-Signature":signature},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode("utf-8","replace")
                  raise RuntimeError(f"webhook HTTP {exc.code}: {detail}") from exc

          status1,result1=post()
          assert status1==200,result1
          assert result1["status"]=="COMPLETED",result1
          assert result1["payment"]=="CONFIRMED",result1
          assert result1["ola_status"]=="VERIFIED",result1
          assert result1["ola_final_result"]=="391",result1
          assert len(result1["ola_evidence_ids"])==6,result1

          status2,result2=post()
          assert status2==200,result2
          assert result2==result1,(result1,result2)

          db=sqlite3.connect(db_path)
          rows=db.execute(
              "SELECT record_type,payload_json FROM evidence_records WHERE tenant_id=? ORDER BY seq",
              (tenant_id,),
          ).fetchall()
          db.close()
          assert len(rows)==8,rows
          assert [r[0] for r in rows]==[
              "stripe.payment_confirmed",
              "agent.codeact",
              "agent.react",
              "agent.agentic_rag",
              "agent.mcp_tool_use",
              "agent.self_reflection",
              "agent.multi_agent",
              "stripe.ola_execution_completed",
          ],rows
          payment_records=[r for r in rows if r[0]=="stripe.payment_confirmed"]
          assert len(payment_records)==1,payment_records
          assert json.loads(payment_records[0][1])["stripe_event_id"]=="evt_ci_ola_checkout_001"
          print(json.dumps({
              "gate":"STRIPE_CHECKOUT_TO_OLA",
              "signature":"PASS",
              "payment":"CONFIRMED",
              "ola_runtime":"VERIFIED",
              "idempotency":"PASS",
              "evidence_count":len(rows)
          },sort_keys=True))
          PY

      - name: Real runtime fault injection and recovery
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          docker pause ola-e2e
          sleep 2
          if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null; then
            echo "FAIL: service remained responsive while container was paused"; docker unpause ola-e2e || true; exit 1
          fi
          docker unpause ola-e2e
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then echo "REAL_RUNTIME_FAULT_RECOVERY=VERIFIED commit=${EXPECTED_COMMIT}"; exit 0; fi
            sleep 1
          done
          docker logs ola-e2e; exit 1

      - name: Capture runtime proof artifact
        if: always()
        run: |
          docker inspect ola-e2e > docker-inspect.json 2>&1 || true
          docker logs ola-e2e > docker-runtime.log 2>&1 || true
          sha256sum docker-inspect.json docker-runtime.log agent-runtime-proof.json business-invoice-proof.json > runtime-file-hashes.txt || true
          printf '%s\n' "commit=${GITHUB_SHA}" "run=${GITHUB_RUN_ID}" > provenance.txt
          sha256sum provenance.txt >> runtime-file-hashes.txt || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ola-runtime-e2e-${{ github.sha }}
          path: |
            docker-inspect.json
            docker-runtime.log
            agent-runtime-proof.json
            business-invoice-proof.json
            runtime-file-hashes.txt
            provenance.txt
          if-no-files-found: warn

      - name: Stop deployment image
        if: always()
        run: docker stop ola-e2e || true
