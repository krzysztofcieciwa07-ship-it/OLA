name: CFR-18 Forensic Gate

on:
  push:
    branches: [cfr18-forensic]
  pull_request:
    paths:
      - 'scenarios/cfr-18/**'
      - '.github/workflows/cfr18-forensic-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scenarios/cfr-18
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify scenario files
        run: |
          set -euo pipefail
          test -f ci/evidence_vault.py
          test -f tests/test_evidence_vault.py
          test -f docker-compose.yml
          test -f Dockerfile
          python3 -m py_compile ci/evidence_vault.py

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Unit forensic gate
        run: |
          set -euo pipefail
          python3 -m pytest -q tests

      - name: Runtime compose validation
        run: |
          set -euo pipefail
          docker compose config

      - name: Docker image build (not just Compose syntax)
        run: |
          set -euo pipefail
          docker compose build

      - name: Evidence tamper proof
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir evidence
          python3 ci/evidence_vault.py session-start
          python3 ci/evidence_vault.py append probe '{"status":"ok","seq":1}'
          python3 ci/evidence_vault.py verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/.chain.jsonl')
          lines=p.read_text().splitlines()
          e=json.loads(lines[1])
          e['payload']['status']='fail'
          lines[1]=json.dumps(e)
          p.write_text('\n'.join(lines)+'\n')
          PY
          if python3 ci/evidence_vault.py verify; then
            echo 'TAMPER TEST FAILED: modified evidence was accepted'
            exit 1
          fi
          echo 'TAMPER TEST PASSED: modified evidence rejected'

      - name: Live Docker API-worker-SQLite smoke (not fault/replay)
        run: |
          set -euo pipefail
          mkdir -p data
          rm -f data/flowai.db data/flowai.db-shm data/flowai.db-wal
          docker compose up -d
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then docker compose logs --no-color || true; fi
            docker compose down --remove-orphans || true
          }
          trap cleanup EXIT
          export SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8080"
          for _ in range(60):
              try:
                  with urlopen(base + "/health", timeout=2) as response:
                      health = json.load(response)
                  if health.get("status") == "ok":
                      break
              except (OSError, URLError, ValueError):
                  pass
              time.sleep(0.25)
          else:
              raise AssertionError("CFR-18 API did not become healthy")

          request = Request(
              base + "/api/generate",
              data=b"{}",
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=5) as response:
              assert response.status == 202
              created = json.load(response)
          job_id = created["job_id"]
          workflow_id = created["workflow_id"]

          for _ in range(80):
              with urlopen(base + f"/api/job/{job_id}", timeout=2) as response:
                  job = json.load(response)
              if job.get("status") == "done":
                  break
              time.sleep(0.25)
          else:
              raise AssertionError(f"CFR-18 worker did not finish job {job_id}: {job}")

          assert job["workflow_id"] == workflow_id
          assert job["attempts"] == 1
          with urlopen(base + "/api/workflows", timeout=5) as response:
              workflows = json.load(response)
          matching = [row for row in workflows if row["workflow_id"] == workflow_id]
          assert len(matching) == 1, "CFR-18 smoke observed missing/duplicate workflow"

          proof = {
              "source_sha": os.environ["SOURCE_SHA"],
              "scope": "api-worker-sqlite-smoke-only",
              "api_health": health["status"],
              "job_id": job_id,
              "workflow_id": workflow_id,
              "job_status": job["status"],
              "attempts": job["attempts"],
              "matching_workflows": len(matching),
              "full_fault_fix_replay": "NOT_VERIFIED",
              "independent_igor": "NOT_VERIFIED",
          }
          Path("evidence/runtime-smoke.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Live fault and opt-in recovery
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(git rev-parse HEAD)"
          docker compose down --remove-orphans
          mkdir -p data
          rm -f data/flowai.db data/flowai.db-wal data/flowai.db-shm
          FAULT_VARIANT=silent_loss RECOVER_STALE_PROCESSING=0 docker compose up -d --force-recreate
          trap 'docker compose down --remove-orphans || true' EXIT
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          def req(path, data=None):
              r=Request("http://127.0.0.1:8080"+path, data=data,
                        headers={"Content-Type":"application/json"})
              with urlopen(r,timeout=3) as f: return json.load(f)
          for _ in range(80):
              try:
                  if req("/health")["status"] == "ok": break
              except OSError: pass
              time.sleep(.2)
          else: raise AssertionError("API not ready")
          created=req("/api/generate",b"{}")
          job_id=created["job_id"]
          for _ in range(80):
              job=req("/api/job/"+str(job_id))
              if job["status"]=="processing": break
              time.sleep(.2)
          else: raise AssertionError("fault not observed")
          assert job["attempts"]==1
          open("evidence/fault-job-id","w").write(str(job_id))
          PY
          docker compose stop worker
          FAULT_VARIANT=double_process RECOVER_STALE_PROCESSING=1 docker compose up -d --no-deps --force-recreate worker
          python3 - <<'PY'
          import json, os, sqlite3, time
          from pathlib import Path
          from urllib.request import urlopen
          jid=int(Path("evidence/fault-job-id").read_text())
          def req(path):
              with urlopen("http://127.0.0.1:8080"+path,timeout=3) as f:
                  return json.load(f)
          for _ in range(100):
              job=req("/api/job/"+str(jid))
              if job["status"]=="done": break
              time.sleep(.2)
          else: raise AssertionError("recovery not completed")
          assert job["attempts"]==2,job
          workflows=req("/api/workflows")
          assert sum(x["workflow_id"]==job["workflow_id"] for x in workflows)==1
          with sqlite3.connect("data/flowai.db") as db:
              events=[r[0] for r in db.execute(
                  "SELECT type FROM events WHERE job_id=?",(jid,))]
          assert "recovery_requeued" in events,events
          proof={"source_sha":os.environ["SOURCE_SHA"],
                 "fault":"silent_loss","observed_processing_attempts":1,
                 "recovery":"opt_in_requeue","completed_attempts":job["attempts"],
                 "matching_effects":1,"recovery_event":"recovery_requeued",
                 "clean_replay":"NOT_VERIFIED","independent_igor":"NOT_VERIFIED"}
          Path("evidence/fault-recovery.json").write_text(json.dumps(proof,sort_keys=True,indent=2)+"\n")
          print(json.dumps(proof,sort_keys=True))
          PY

      - name: Independent isolated replay and evidence consistency
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(git rev-parse HEAD)"
          python3 ci/clean_replay.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from ci.evidence_vault import verify_chain
          root=Path("evidence")
          names=["runtime-smoke.json","fault-recovery.json","clean-replay.json"]
          docs=[json.loads((root/name).read_text()) for name in names]
          assert all(x["source_sha"]==os.environ["SOURCE_SHA"] for x in docs)
          assert docs[0]["job_status"]=="done" and docs[0]["matching_workflows"]==1
          assert docs[1]["completed_attempts"]==2 and docs[1]["matching_effects"]==1
          assert docs[2]["deterministic_replay"]=="PASS"
          assert docs[2]["cycles"][0]==docs[2]["cycles"][1]
          assert verify_chain()["valid"] is False, "negative tamper fixture unexpectedly valid"
          report={"source_sha":os.environ["SOURCE_SHA"],
                  "independent_consistency":"PASS",
                  "negative_tamper_rejected":True,
                  "clean_sqlite_replay":"PASS",
                  "full_docker_replay":"NOT_VERIFIED",
                  "independent_igor":"NOT_VERIFIED"}
          (root/"replay-verification.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Commit positive SHA-bound evidence chain
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("evidence")
          names=("runtime-smoke.json","fault-recovery.json","clean-replay.json","replay-verification.json")
          digests={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}
          genesis=hashlib.sha256(b"CFR-18-GENESIS").hexdigest()
          rows=[]
          prev=genesis
          for kind,payload in (("session_start",{"source_sha":os.environ["SOURCE_SHA"]}),
                               ("evidence_commit",{"source_sha":os.environ["SOURCE_SHA"],"sha256":digests})):
              row={"ts":"2026-01-01T00:00:00+00:00","type":kind,"payload":payload,"prev_hash":prev}
              row["hash"]=hashlib.sha256(json.dumps(row,sort_keys=True).encode()).hexdigest()
              rows.append(row)
              prev=row["hash"]
          (root/"valid-chain.jsonl").write_text("".join(json.dumps(x,sort_keys=True)+"\\n" for x in rows))
          PY
          python3 ci/independent_verify.py --evidence evidence --sha "$SOURCE_SHA"

      - name: Assert evidence files exist
        run: |
          set -euo pipefail
          test -s evidence/.chain.jsonl
          test -s evidence/runtime-smoke.json
          test -s evidence/fault-recovery.json
          test -s evidence/clean-replay.json
          test -s evidence/replay-verification.json
          test -s evidence/valid-chain.jsonl

      - name: Publish gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfr18-forensic-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: scenarios/cfr-18/evidence
          include-hidden-files: true
          if-no-files-found: error

  independent-evidence-gate:
    needs: forensic-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch producer artifact without producer workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cfr18-forensic-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: isolated-evidence
      - name: Verify evidence in separate job
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scenarios/cfr-18/ci/independent_verify.py --evidence isolated-evidence --sha "$SOURCE_SHA"
