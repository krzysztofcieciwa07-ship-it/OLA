name: CFR-18 Forensic Gate

on:
  push:
    branches: [cfr18-forensic]
  pull_request:
    paths:
      - 'scenarios/cfr-18/**'
      - '.github/workflows/cfr18-forensic-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scenarios/cfr-18
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify scenario files
        run: |
          set -euo pipefail
          test -f ci/evidence_vault.py
          test -f tests/test_evidence_vault.py
          test -f docker-compose.yml
          test -f Dockerfile
          python3 -m py_compile ci/evidence_vault.py

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Unit forensic gate
        run: |
          set -euo pipefail
          python3 -m pytest -q tests

      - name: Runtime compose validation
        run: |
          set -euo pipefail
          docker compose config

      - name: Docker image build (not just Compose syntax)
        run: |
          set -euo pipefail
          docker compose build

      - name: Evidence tamper proof
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir evidence
          python3 ci/evidence_vault.py session-start
          python3 ci/evidence_vault.py append probe '{"status":"ok","seq":1}'
          python3 ci/evidence_vault.py verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/.chain.jsonl')
          lines=p.read_text().splitlines()
          e=json.loads(lines[1])
          e['payload']['status']='fail'
          lines[1]=json.dumps(e)
          p.write_text('\n'.join(lines)+'\n')
          PY
          if python3 ci/evidence_vault.py verify; then
            echo 'TAMPER TEST FAILED: modified evidence was accepted'
            exit 1
          fi
          echo 'TAMPER TEST PASSED: modified evidence rejected'

      - name: Publish gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfr18-forensic-gate-${{ github.sha }}
          path: scenarios/cfr-18/evidence
          if-no-files-found: error
