name: Feature request
description: Propose a focused improvement to OLA.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, evidence, or compatibility constraints
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Make the outcome objectively testable.
    validations:
      required: true
