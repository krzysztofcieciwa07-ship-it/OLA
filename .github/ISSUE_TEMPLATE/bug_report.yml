name: Bug report
description: Report a reproducible defect in OLA.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, secrets, customer data, or private evidence."
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      description: Exact release or commit where the issue occurs.
      placeholder: "40-character commit SHA"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include sanitized commands and inputs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or CI evidence
      description: Link the workflow run and identify failed checks. Remove sensitive data.
    validations:
      required: false
