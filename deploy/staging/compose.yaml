# OLA staging only. Local loopback, no public deployment or default secrets.
name: ola-staging
services:
  ola:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      OLA_EG_DB_PATH: /data/ola.db
      OLA_LLM_MODE: deterministic
      OLA_RUNTIME_COMMIT: ${OLA_STAGING_COMMIT:?40-character source commit required}
      OLA_API_KEY_PEPPER: ${OLA_STAGING_PEPPER:?ephemeral staging pepper required}
    ports:
      - "127.0.0.1:${OLA_STAGING_PORT:-18080}:8000"
    volumes:
      - ola_evidence:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3).read()"]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 8
volumes:
  ola_evidence: {}
