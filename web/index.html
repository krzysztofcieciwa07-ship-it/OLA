<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NINA</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f5f5f5}
main{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 24px #0001}
#messages{min-height:55vh;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:12px;white-space:pre-wrap}.user{align-self:flex-end;background:#e8eefc}.nina{align-self:flex-start;background:#eee}
form{display:flex;gap:8px;margin-top:16px}textarea{flex:1;resize:vertical;min-height:48px;padding:10px}button{padding:10px 16px}
small{color:#666}
</style>
</head>
<body>
<main>
<h1>NINA</h1>
<small>Verified conversational runtime</small>
<div id="messages"></div>
<form><textarea id="input" placeholder="Napisz do NINA..."></textarea><button>Wyślij</button></form>
</main>
<script>
const messages=[];
const box=document.querySelector("#messages"), input=document.querySelector("#input");
function add(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
document.querySelector("form").onsubmit=async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 input.value=""; messages.push({role:"user",content:text}); add("user",text);
 const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json","X-API-Key":"demo-chat-key"},body:JSON.stringify({messages})});
 const d=await r.json(); const answer=d.message||("NINA BLOCK: "+(d.reason||"unknown"));
 messages.push({role:"assistant",content:answer}); add("nina",answer);
};
add("nina","Cześć. Jestem NINA. Napisz do mnie.");
</script>
</body>
</html>
